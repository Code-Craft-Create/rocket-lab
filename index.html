<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd4ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skyhop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Skyhop Express: build a passenger rocket line from Grandma Ada's backyard to the stars.">
<title>Skyhop Express</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4c10 8 14 20 14 32H18C18 24 22 12 32 4z' fill='%23fff6e5' stroke='%232b2240' stroke-width='4'/%3E%3Ccircle cx='32' cy='26' r='6' fill='%234d96ff' stroke='%232b2240' stroke-width='3'/%3E%3Cpath d='M18 36l-8 14h12zM46 36l8 14H42z' fill='%23ff5a5f' stroke='%232b2240' stroke-width='3'/%3E%3Cpath d='M26 46l6 14 6-14z' fill='%23ffd93d' stroke='%232b2240' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#2b2240; --ink2:#4a3f66; --cream:#fff6e5; --paper:#fffaf0;
  --red:#ff5a5f; --orange:#ff9f43; --yellow:#ffd93d; --green:#5fd068; --teal:#2ec4b6;
  --blue:#4d96ff; --purple:#9b5de5; --pink:#f15bb5; --sky:#7fd4ff; --gold:#ffc83d;
  --font:"Fredoka","Baloo 2","Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#7fd4ff;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.screen{position:absolute;inset:0;pointer-events:none}
.screen > *{pointer-events:auto}
.hidden{display:none!important}
button{font-family:var(--font)}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink),0 14px 30px rgba(20,10,50,.25)}
.btn{font-weight:800;font-size:18px;letter-spacing:.3px;border:4px solid var(--ink);border-radius:16px;padding:9px 18px;
  background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;position:relative;
  transition:transform .07s,box-shadow .07s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:26px;padding:12px 26px;border-radius:20px}
.btn.go{background:var(--green)}
.btn.blue{background:var(--blue);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn:disabled{filter:grayscale(.85) opacity(.65);cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.small{font-size:15px;padding:6px 12px;border-radius:13px;flex:0 0 auto}
.btn.off{filter:grayscale(.85) opacity(.6)}
.seg{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
@media (max-width:480px){.seg{gap:5px}.seg .btn.small{padding:5px 9px;font-size:13px}}
@media (max-width:360px){.seg .btn.small{padding:4px 7px;font-size:12px}}
.route .r-ico canvas{width:64px;height:64px;display:block}
.icon-btn{width:46px;height:46px;border:4px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--ink);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .07s,box-shadow .07s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:26px;height:26px}
.icon-btn.off{opacity:.55}
.icon-btn.off::after{content:"";position:absolute;width:30px;height:4px;background:var(--red);transform:rotate(-45deg);border-radius:2px}

/* ---------- Title ---------- */
#scr-title{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:max(7vh,30px)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;transform:rotate(-4deg);pointer-events:none;
  animation:logoBob 3s ease-in-out infinite}
.logo span{font-weight:900;font-size:clamp(54px,12vw,118px);letter-spacing:2px;color:var(--yellow);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink),0 18px 30px rgba(0,0,40,.35)}
.logo .l2{color:var(--red);font-size:clamp(40px,8.5vw,84px);margin-left:18%}
.tagline{margin-top:20px;background:var(--ink);color:var(--cream);font-weight:800;padding:6px 16px;border-radius:999px;font-size:clamp(14px,2.4vw,20px);
  transform:rotate(-2deg);pointer-events:none}
#title-bottom{position:absolute;bottom:max(8vh,30px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
#title-bottom > *{pointer-events:auto}
#btn-start{animation:pulse 1.4s ease-in-out infinite}
.title-foot{font-weight:800;color:var(--ink);background:rgba(255,246,229,.85);padding:6px 14px;border-radius:12px;font-size:14px;border:3px solid var(--ink);max-width:calc(100vw - 32px);text-align:center;box-sizing:border-box}
.title-daily{font-weight:800;color:var(--ink);background:#ffe3f1;padding:5px 12px;border-radius:999px;font-size:13px;border:3px solid var(--ink);max-width:calc(100vw - 32px);text-align:center;box-sizing:border-box;margin-top:22px;transform:rotate(2deg);box-shadow:0 4px 0 var(--ink)}
@media (max-width:600px){#scr-title{padding-top:max(7vh,30px,74px)}#title-tools{top:10px;right:10px}#title-tools .icon-btn{transform:scale(.85);transform-origin:top right}}
#title-tools{position:absolute;top:14px;right:14px;display:flex;gap:10px}
@keyframes logoBob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- Hangar ---------- */
#scr-hangar .side{position:absolute;right:16px;top:16px;bottom:16px;width:min(640px,58vw);display:flex;flex-direction:column;overflow:visible}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 14px;gap:8px;flex:0 0 auto}
.money{display:flex;align-items:center;gap:8px;font-weight:900;font-size:28px;background:var(--ink);color:var(--yellow);padding:4px 14px 4px 6px;border-radius:999px}
.money .coin{width:30px;height:30px}
.money.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.15)}}
.head-btns{display:flex;gap:8px;position:relative}
.head-btns .icon-btn{position:relative}
.badge-dot{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:11px;font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:1px 5px;line-height:1.1}
#tabs{position:relative;display:flex;gap:6px;padding:4px 12px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:0 0 auto;min-height:44px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:4px solid var(--ink);border-bottom:none;border-radius:14px 14px 0 0;padding:6px 10px 6px 8px;
  background:#e9dcc4;font-weight:800;font-size:15px;cursor:pointer;position:relative;color:var(--ink2);transform:translateY(4px)}
.tab svg{width:24px;height:24px}
.tab.active{background:var(--paper);color:var(--ink);transform:translateY(4px);z-index:2}
#tabs.compact .tab:not(.active) span:not(.badge-dot){display:none}
#tabs.compact .tab{padding:6px 8px}
.tab .badge-dot{top:-9px;right:-6px}
.tab.new-tab{animation:tabGlow 1.2s ease-in-out infinite}
@keyframes tabGlow{50%{background:#fff3b0}}
#tree{position:relative;flex:1 1 auto;min-height:110px;background:var(--paper);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);overflow:auto;
  background-image:radial-gradient(circle,rgba(43,34,64,.09) 1.5px,transparent 2px);background-size:22px 22px}
#tree-inner{position:relative;margin:0 auto}
.tree-fade{position:sticky;left:0;bottom:0;height:30px;margin-top:-30px;pointer-events:none;background:linear-gradient(rgba(255,250,240,0),var(--paper) 80%);opacity:0;transition:opacity .2s;z-index:3}
.tree-fade::after{content:"";position:absolute;left:50%;bottom:7px;width:9px;height:9px;border-right:3px solid var(--ink2);border-bottom:3px solid var(--ink2);border-radius:0 0 3px 0;transform:translateX(-50%) rotate(45deg);animation:fadeNudge 1.4s ease-in-out infinite}
@keyframes fadeNudge{50%{bottom:4px}}
#tree.more-below .tree-fade{opacity:1}
#tree-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.node{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transform:translate(-50%,-50%)}
.node .nbox{width:66px;height:66px;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;transition:transform .1s}
.node .nbox svg{width:38px;height:38px;flex:0 0 auto}
.node:hover .nbox{transform:translateY(-2px)}
.node.sel .nbox{outline:4px solid var(--blue);outline-offset:3px}
.node.can .nbox{background:#fffbe0;animation:canGlow 1.6s ease-in-out infinite}
@keyframes canGlow{50%{box-shadow:0 4px 0 var(--ink),0 0 0 6px rgba(255,217,61,.55)}}
.node.max .nbox{background:linear-gradient(160deg,#fff4c2,#ffd96a)}
.node.locked .nbox{background:#d9d0c0}
.node.locked .nbox svg{opacity:.35;filter:grayscale(1)}
.node.forkout .nbox{background:#e6e0d6}
.node.forkout .nbox svg{opacity:.4;filter:grayscale(1)}
.node .nlabel{margin-top:10px;font-weight:800;font-size:12px;text-align:center;line-height:1.05;background:rgba(255,250,240,.9);padding:1px 4px;border-radius:6px;max-width:92px}
/* level meter tucked inside the bottom of each upgrade button */
.pips{display:flex;gap:1.5px;width:46px;height:11px;padding:1.5px;border:2px solid var(--ink);border-radius:999px;background:#ece3d2;box-sizing:border-box;overflow:hidden;flex:0 0 auto}
.pip{flex:1 1 0;min-width:0;border-radius:2px}
.pip:first-child{border-radius:999px 2px 2px 999px}.pip:last-child{border-radius:2px 999px 999px 2px}
.pip.on{background:var(--green)}
.pips.bar .pip{flex:none;border-radius:999px}
.node.max .pip.on{background:#ffb000}
.node.locked .pips{visibility:hidden}
.node.sel .newb{display:none} /* the detail panel already shows it; keeps the selection ring clean */
.node.forkout .pips{opacity:.45}
.node .lock{position:absolute;right:-8px;bottom:-8px;width:24px;height:24px}
.node .newb{position:absolute;top:-10px;left:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:900;border:3px solid var(--ink);border-radius:8px;padding:0 4px;transform:rotate(-10deg)}
#tree.compact .node .nbox{width:54px;height:54px;border-radius:15px}
#tree.compact .node .nbox svg{width:30px;height:30px}
#tree.compact .node .nbox{gap:2px}
#tree.compact .pips{width:38px;height:10px}
#tree.compact .node .nlabel{font-size:11px;margin-top:9px}
.orb{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:var(--yellow);font-weight:900;font-size:13px;border-radius:999px;padding:2px 8px;pointer-events:none}
#detail{padding:10px 14px;display:flex;gap:12px;align-items:flex-start;min-height:118px;flex:0 0 auto}
#detail .dicon{flex:0 0 auto;width:74px;height:74px;border:4px solid var(--ink);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center}
#detail .dicon svg{width:54px;height:54px}
#detail .dbody{flex:1 1 auto;min-width:0}
#detail h3{font-size:21px;font-weight:900;line-height:1.05;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#detail .lvl{font-size:13px;background:var(--ink);color:var(--cream);padding:2px 8px;border-radius:999px}
#detail p{font-size:14px;line-height:1.25;margin:4px 0 6px;color:var(--ink2);font-weight:700}
#detail .fx{font-size:14px;font-weight:800;color:var(--ink)}
#detail .fx b{color:#1d9e4c}
#detail .dact{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center;align-self:center}
#detail .dact .btn{font-size:17px;padding:8px 14px}
#detail .note{font-size:12px;font-weight:800;color:var(--purple)}
.btn.auto{display:flex;align-items:center;justify-content:center;gap:4px;background:#ead9ff;font-size:14px;padding:5px 10px;border-radius:13px;box-shadow:0 4px 0 var(--ink)}
.btn.auto svg{width:20px;height:20px;flex:0 0 auto;margin:-3px 0}
.btn.auto.undo{background:#fff1b8}
.btn.auto .an{background:var(--ink);color:var(--yellow);border-radius:999px;font-size:11px;padding:0 6px;line-height:16px}
@media (max-width:820px),(max-height:520px){.btn.auto{font-size:13px;padding:4px 8px}.btn.auto svg{width:17px;height:17px}}
@media (max-height:520px){#detail .dact{flex-direction:row;align-items:center}}
.side-foot{display:flex;gap:10px;align-items:center;padding:10px 12px 12px;flex:0 0 auto}
#route-chip{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:6px 10px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
#route-chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#route-chip .rc-ico{flex:0 0 auto;width:40px;height:40px}
#route-chip .rc-t{min-width:0}
#route-chip .rc-k{font-size:11px;font-weight:900;color:var(--purple);text-transform:uppercase;letter-spacing:.6px}
#route-chip .rc-n{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#route-chip .rc-s{font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btn-launch{animation:pulse 1.6s ease-in-out infinite}
#statcard{position:absolute;left:16px;top:16px;padding:10px 14px;min-width:200px;font-weight:800;font-size:14px}
#statcard h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--purple);margin-bottom:4px}
#statcard .row{display:flex;justify-content:space-between;gap:16px;line-height:1.5}
#statcard .row span:last-child{color:var(--ink)}
#statcard .best{margin-top:6px;padding-top:6px;border-top:3px dashed rgba(43,34,64,.25)}
#statcard .jobs{margin-top:8px;padding-top:8px;border-top:3px dashed rgba(43,34,64,.25);cursor:pointer;max-width:250px}
#statcard .jobs:hover h4{text-decoration:underline}
#statcard .job{display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:1.3;margin:3px 0}
#statcard .job b{color:var(--purple)}
#statcard .job .jp{color:#1d9e4c;white-space:nowrap}
@media (max-width:820px) and (min-height:521px){
  #scr-hangar .side{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:min(66%,780px)}
}
@media (max-width:820px),(max-height:520px){
  #statcard{display:none}
  .money{font-size:22px}
  .head-btns{gap:6px}
  .head-btns .icon-btn{width:40px;height:40px;border-radius:12px}
  .head-btns .icon-btn svg{width:22px;height:22px}
  .side-head{padding:8px 10px 4px}
  #detail{min-height:86px;padding:8px 10px;gap:8px}
  #detail h3{font-size:17px}
  #detail p{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 3px}
  #detail .fx{font-size:12px}
  #detail .dicon{width:54px;height:54px;border-radius:14px}
  #detail .dicon svg{width:40px;height:40px}
  #detail .dact .btn{font-size:15px;padding:7px 10px}
  .side-foot{padding:8px 10px 10px}
  #route-chip{padding:4px 8px}
  #route-chip .rc-n{font-size:14px}#route-chip .rc-n.long{font-size:12.5px;letter-spacing:-.2px}
  .toast{font-size:13px;padding:6px 12px}
  .rc-pre{display:none}
  .btn.big{font-size:22px;padding:10px 18px}
}
@media (max-width:440px){
  .money{font-size:19px;padding:3px 10px 3px 4px;gap:5px}
  .money .coin{width:24px;height:24px}
  .head-btns{gap:5px}
  .head-btns .icon-btn{width:36px;height:36px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
  .head-btns .icon-btn svg{width:20px;height:20px}
}
/* very small phones (320 px wide, 568 px tall) */
@media (max-width:360px){
  .money{font-size:16px;padding:2px 8px 2px 3px;gap:4px}
  .money .coin{width:20px;height:20px}
  .head-btns{gap:4px}
  .head-btns .icon-btn{width:32px;height:32px}
  .head-btns .icon-btn svg{width:18px;height:18px}
  .head-btns .badge-dot{top:-7px;right:-6px;font-size:10px;padding:0 4px}
  .side-head{padding:6px 6px 2px 8px;gap:4px}
  #detail .dicon{width:44px;height:44px}
  #detail .dicon svg{width:32px;height:32px}
  #detail .dact .btn{font-size:14px;padding:6px 8px}
  .ov-head h2{font-size:21px}
  body #dialog canvas{width:62px;height:62px;border-radius:14px}
  body #dialog .dl-text{font-size:16px}
  .side-foot{gap:8px}
  #route-chip{padding:4px 9px}
  #route-chip .rc-ico{display:none}
  #route-chip .rc-k{font-size:10px;letter-spacing:.3px}
  .side-foot .btn.big{font-size:19px;padding:9px 11px}
}
@media (max-width:820px) and (min-height:521px) and (max-height:620px){
  #scr-hangar .side{height:74%}
  #tree{min-height:72px}
}
/* short landscape screens (phones on their side): full-height side panel */
@media (max-height:520px){
  #scr-hangar .side{left:auto;right:8px;top:6px;bottom:6px;height:auto;width:min(440px,54vw)}
  .side-head{padding:6px 8px 2px}
  .money{font-size:18px;padding:2px 10px 2px 4px}
  .money .coin{width:22px;height:22px}
  .head-btns{gap:5px}
  .head-btns .icon-btn{width:34px;height:34px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
  .head-btns .icon-btn svg{width:19px;height:19px}
  #tabs{min-height:38px;padding-top:2px}
  .tab{padding:4px 8px;font-size:13px}
  .tab svg{width:20px;height:20px}
  #tree{min-height:70px}
  #detail{min-height:70px;padding:6px 8px}
  #detail .dicon{width:44px;height:44px}
  #detail .dicon svg{width:32px;height:32px}
  #detail h3{font-size:15px}
  #detail p{display:none}
  #detail{min-height:56px}
  .side-foot{padding:6px 8px 8px;gap:8px}
  #route-chip{padding:3px 8px}
  #route-chip .rc-ico{width:26px;height:26px}
  #route-chip .rc-k,#route-chip .rc-s{display:none}
  .btn.big{font-size:18px;padding:6px 14px}
  body.in-hangar #toasts{left:calc((100vw - min(440px,54vw) - 16px)/2)}
  .toast{font-size:12px;padding:5px 10px;max-width:42vw}
  body.in-flight #toasts{top:auto;bottom:10px}
  body.in-flight .toast{font-size:12px;padding:4px 10px;max-width:44vw;border-width:2px;animation-name:toastUp,toastOut}
}
/* small phones on their side (568 px wide): wider panel so every header button fits */
@media (max-height:520px) and (max-width:640px){
  #scr-hangar .side{width:62vw}
  html body.in-hangar #toasts{left:calc(19vw - 8px);width:calc(38vw - 16px)}
  body.in-hangar .toast{max-width:100%}
  .money{font-size:15px;padding:2px 8px 2px 3px}
  .money .coin{width:18px;height:18px}
  .head-btns{gap:4px}
  .head-btns .icon-btn{width:30px;height:30px}
  .head-btns .icon-btn svg{width:17px;height:17px}
}

/* the workshop menu folds away to show the yard (F key); on phones it can also open tall */
.fold-bar{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;gap:2px;background:var(--cream);border:4px solid var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.fold-bar.sheet{top:-36px;left:50%;transform:translateX(-50%);height:36px;padding:0 6px;border-bottom:none;border-radius:16px 16px 0 0}
.fold-bar.edge{left:-36px;top:50%;transform:translateY(-50%);width:36px;flex-direction:column;padding:8px 0;border-right:none;border-radius:16px 0 0 16px;box-shadow:-4px 5px 0 rgba(43,34,64,.18)}

<script>
(() => {
'use strict';

/* =====================================================================
   SKYHOP EXPRESS — a tiny rocket company game
   Everything (art, sound, music) is generated in code.
   ===================================================================== */

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smooth = t => t * t * (3 - 2 * t);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function fmtInt(n) { return Math.round(n).toLocaleString('en-US'); }
function fmtMoney(n) {
  n = Math.round(n);
  if (n < 100000) return '$' + fmtInt(n);
  if (n < 1e6) return '$' + (n / 1000).toFixed(n < 1e6 ? 1 : 0).replace(/\.0$/, '') + 'K';
  if (n < 1e9) return '$' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return '$' + (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
}
function fmtAlt(m) {
  m = Math.max(0, m);
  if (m < 10000) return fmtInt(m) + '\u00a0m'; // non-breaking space: number and unit never wrap apart
  if (m < 100000) return (m / 1000).toFixed(1) + '\u00a0km';
  return fmtInt(m / 1000) + '\u00a0km';
}
function fmtSpeed(v) { return fmtInt(Math.abs(v)) + '\u00a0m/s'; }
function fmtDur(sec) {
  sec = Math.round(sec);
  if (sec < 60) return sec + '\u00a0s';
  if (sec < 3600) return Math.floor(sec / 60) + '\u00a0min ' + (sec % 60) + '\u00a0s';
  return Math.floor(sec / 3600) + '\u00a0h ' + Math.floor(sec % 3600 / 60) + '\u00a0min';
}

function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgbStr(c, a = 1) { return a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixHex(a, b, t) { return rgbStr(mixRGB(hex2rgb(a), hex2rgb(b), t)); }

// deterministic pseudo random (for stable backgrounds)
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
function srand(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }

// ----------------------------------------------------------------- save
const SAVE_KEY = 'skyhop_express_save_v1';
function defaultSave() {
  return {
    v: 1, money: 0, earned: 0, flights: 0, bestAlt: 0, charted: {},
    up: {},            // upgrade id -> level
    routes: {},        // route id -> {done, stars, runs}
    route: 'r0',       // selected route id ('free' = free flight)
    seen: {},          // story / disclosure flags
    viewed: {},        // upgrade nodes the player has looked at
    tabsSeen: {},
    stats: { coins: 0, hits: 0, perfect: 0, rings: 0, smashed: 0, pax: 0, time: 0, jobs: 0, nights: 0, close: 0, pokes: 0, king: 0, whale: 0, kraken: 0, pirates: 0, daily: 0, wishes: 0 },
    ach: {},
    cond: 'clear', jobs: [], avg: { coins: 8, rings: 0.6, close: 0.6, alt: 500, v: 110, total: 110, smash: 0 },
    settings: { music: true, sfx: true, shake: !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), ghost: true, musVol: 1, sfxVol: 1 },
    ghosts: {},        // route id -> {alt, step, a:[alt...], x:[x...]} best run replay
    log: [],           // last 30 flights for the logbook chart: {n, a, r, d}
    rec: {},           // personal records: id -> {v, n}
    news: 0,           // how many WORKSHOP_NEWS items this player has heard from Ada
    ended: false,
  };
}
let S = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      // merge nested settings over fresh defaults (the top-level assign below replaces def's own nested
      // objects, so older saves would otherwise miss settings and stats added since)
      const def = defaultSave(), fresh = defaultSave();
      S = Object.assign(def, d);
      S.stats = Object.assign(fresh.stats, d.stats || {});
      S.settings = Object.assign(fresh.settings, d.settings || {});
      S.avg = Object.assign(fresh.avg, d.avg || {});
      for (const k of ['musVol', 'sfxVol']) if (!isFinite(S.settings[k]) || S.settings[k] === null) S.settings[k] = 1;
      if (!S.rec.alt && S.bestAlt > 0) S.rec.alt = { v: S.bestAlt, n: 0 };
      // welcome-back bonus: the gift stand keeps selling while you're away (from 1 hour, capped at 8)
      const away = S.lastSeen ? (Date.now() - S.lastSeen) / 36e5 : 0;
      if (away >= 1 && S.flights >= 3 && (S.avg.total || 0) > 0) S.pendingAway = Math.max(10, Math.round(S.avg.total * 0.25 * Math.min(away, 8)));
    }
  } catch (e) { S = defaultSave(); }
}
let saveTimer = 0;
let saveLock = false; // set while a loaded save code reloads the page, so the old save can't overwrite it
function saveGame() { if (saveLock) return; S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
// save codes: copy your progress to another device (ghost replays are left out to keep the code short)
function exportSave() { const o = Object.assign({}, S); delete o.ghosts; return 'SKYHOP1.' + btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function importSave(str) {
  str = (str || '').replace(/\s+/g, '');
  if (!str.startsWith('SKYHOP1.')) return null;
  try { const d = JSON.parse(decodeURIComponent(escape(atob(str.slice(8))))); return d && typeof d === 'object' && typeof d.flights === 'number' && d.up && d.routes ? d : null; } catch (e) { return null; }
}
function resetSave() { S = defaultSave(); saveGame(); }

// ================================================================ AUDIO
const AudioSys = (() => {
  let ac = null, master, comp, sfxBus, musBus, noiseBuf = null;
  let engSet = null, windNoise, windFilter, windGain;
  let enabledSfx = true, enabledMusic = true, volS = 1, volM = 1;
  const MUS_VOL = 0.32, SFX_VOL = 0.75;

  function init() {
    if (ac) { resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ac.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = enabledSfx ? SFX_VOL * volS : 0; sfxBus.connect(master);
    musBus = ac.createGain(); musBus.gain.value = enabledMusic ? MUS_VOL * volM : 0; musBus.connect(master);
    // noise buffer
    const len = ac.sampleRate * 2;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    engSet = makeEngine(ac, sfxBus, noiseBuf);
    // wind loop
    windNoise = ac.createBufferSource(); windNoise.buffer = noiseBuf; windNoise.loop = true; windNoise.playbackRate.value = 0.7;
    windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 800; windFilter.Q.value = 0.6;
    windGain = ac.createGain(); windGain.gain.value = 0;
    windNoise.connect(windFilter); windFilter.connect(windGain); windGain.connect(sfxBus);
    windNoise.start();
    Music._attach();
  }
  // engine loop. A rocket is a roar, not a note (a pitched hum is what made it sound like a car), so every layer is
  // noise: a deep rumble, the main roar, a thin jet hiss and the crackle of the exhaust. Returns a setter.
  function makeEngine(ac, dest, white) {
    const sr = ac.sampleRate, len = white.length;
    const brown = ac.createBuffer(1, len, sr), bd = brown.getChannelData(0); let lb = 0;
    for (let i = 0; i < len; i++) { lb = (lb + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = lb * 3.5; }
    const drift = bd[len - 1] - bd[0]; for (let i = 0; i < len; i++) bd[i] -= drift * i / (len - 1); // seamless loop, no tick
    const clen = Math.floor(sr * 2.7), crk = ac.createBuffer(1, clen, sr), cd = crk.getChannelData(0);
    for (let i = 0; i < clen; i++) if (Math.random() < 0.0009) { const a = 0.3 + Math.random() * 0.7, tau = 20 + Math.random() * 90; for (let j = 0; j < tau * 4 && i + j < clen; j++) cd[i + j] += a * (Math.random() * 2 - 1) * Math.exp(-j / tau); }
    const layer = (buf, rate, type, f, q, hp) => {
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.playbackRate.value = rate;
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = ac.createGain(); g.gain.value = 0; src.connect(fl);
      if (hp) { const h = ac.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = hp; h.Q.value = 0.7; fl.connect(h); h.connect(g); } else fl.connect(g);
      g.connect(dest); src.start(); return { fl, g };
    };
    // the highpass cuts the sub-bass speakers can't play anyway, which would only pump the compressor
    const roar = layer(brown, 1, 'lowpass', 500, 0.7, 45), rumble = layer(brown, 0.5, 'bandpass', 75, 0.9);
    const hiss = layer(white, 1, 'bandpass', 2600, 0.6), crackle = layer(crk, 1, 'highpass', 900, 0.7);
    return (th, boost, t) => {
      roar.g.gain.setTargetAtTime(th * 0.52, t, 0.06);
      roar.fl.frequency.setTargetAtTime(380 + th * 620 + (boost ? 900 : 0), t, 0.08);
      rumble.g.gain.setTargetAtTime(Math.min(th, 1.1) * 0.8, t, 0.1);
      hiss.g.gain.setTargetAtTime(th * 0.035 + (boost ? 0.06 : 0), t, 0.08);
      crackle.g.gain.setTargetAtTime(Math.min(th, 1.2) * 0.28 + (boost ? 0.08 : 0), t, 0.05);
    };
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); }
  function suspend() { if (ac && ac.state === 'running') ac.suspend().catch(() => {}); }
  function now() { return ac ? ac.currentTime : 0; }

  function setSfx(on) { enabledSfx = on; if (ac) sfxBus.gain.setTargetAtTime(on ? SFX_VOL * volS : 0, ac.currentTime, 0.05); }
  function setMusic(on) { enabledMusic = on; if (ac) musBus.gain.setTargetAtTime(on ? MUS_VOL * volM : 0, ac.currentTime, 0.1); }
  // volume sliders: v from 0 to 1, a gentle curve so the low end is usable
  function setVol(kind, v) { v = Number(v); if (!isFinite(v)) v = 1; v = Math.max(0, Math.min(1, v)) ** 1.6; if (kind === 'music') { volM = v; setMusic(enabledMusic); } else { volS = v; setSfx(enabledSfx); } }

  // generic tone with envelope
  function tone(o) {
    if (!ac) return;

function drawChartShape(c, ch, size, k = 1, lit = true, t = 0) {
  // k: how much of the joining lines are drawn (0..1); lit: gold once charted, pale before
  c.save(); c.lineCap = 'round';
  const P = ch.pts.map(([x, y]) => [x * size, y * size]);
  c.strokeStyle = lit ? 'rgba(255,229,138,.9)' : 'rgba(255,255,255,.35)'; c.lineWidth = Math.max(1.5, size * 0.035);
  if (!lit) c.setLineDash([size * 0.05, size * 0.07]);
  ch.ln.forEach(([a, b], i) => { const f = clamp(k * ch.ln.length - i, 0, 1); if (f <= 0) return; const [x1, y1] = P[a], [x2, y2] = P[b]; c.beginPath(); c.moveTo(x1, y1); c.lineTo(lerp(x1, x2, f), lerp(y1, y2, f)); c.stroke(); });
  c.setLineDash([]);
  P.forEach(([x, y], i) => { const tw = 0.75 + 0.25 * Math.sin(t * 3 + i * 1.9), r = size * (0.05 + 0.02 * hash(i * 3.3)) * tw;
    c.fillStyle = lit ? '#fff6c8' : '#ffffff'; c.beginPath(); c.moveTo(x, y - r * 2); c.quadraticCurveTo(x, y, x + r * 2, y); c.quadraticCurveTo(x, y, x, y + r * 2); c.quadraticCurveTo(x, y, x - r * 2, y); c.quadraticCurveTo(x, y, x, y - r * 2); c.fill(); });
  c.restore();
}

// Advance the vertical flight model. Shared between the real game and the balance simulator.

// Picks the upgrades a sensible engineer would buy with the money you have: whatever adds the most height per coin,
// plus seats when the next route needs them and a fair share of safety, comfort and money-makers along the way.
const AUTO_W = { // what a level is worth besides height, as if it added this much height (fraction)

function autoPlan(budget = S.money, maxBuys = 160) {
  const realUp = S.up, plan = [];

    let money = budget;

    for (let n = 0; n < maxBuys; n++) {

      const cands = UPGRADES.filter(u => upState(u) === 'open' && upCost(u) <= money && !(u.fork && !forkChoice(u.fork)) && u.br !== 'town'); // the town is yours to plan

}

// puffy cloud made of circles
function cloudShape(c, x, y, w, h, seed) {
  const r = srand(seed);

  c.beginPath();
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const cx = x - w / 2 + t * w;
    const bump = Math.sin(t * Math.PI);
    const cy = y - bump * h * (0.35 + r() * 0.25);

  if (alpha < 0.995 && lw && c === ctx) {
    // a fading cloud: paint it solid on a scratch canvas, then fade the whole picture at once, so the outlines
    // of the overlapping bumps (hidden under the fill when it's opaque) never show through
    if (alpha <= 0.005) return;
    const m = c.getTransform(), cw = c.canvas.width, ch = c.canvas.height, pad = lw * 2 + 3;

      const nx = nextRoute(); if (nx) S.route = nx.id; else S.route = r.fr ? 'x5' : 'r7';
      if (r.id === 'r7') S.ended = true;
    }
  }
  if (rivalWon) { S.rival = S.rival || {}; S.rival[rivalWon.id] = 1; S.pendingRival = rivalWon.id; if (rivalWon.id === 'v5') { S.met = S.met || {}; S.met.baron = Math.max(S.met.baron || 0, 30); } }
  if (R.cond === 'night') S.stats.nights++;
  S.cond = rollCond();
  fixDailyRoute();
  if (prevFlights === 0) S.pendingFirst = true;
  if (R.crashed && !S.seen.crash) S.pendingCrash = true;
  checkAchievements();
  if (checkMail()) S.pendingMail = 1;
  saveGame();
}

const REVIEWS = {
  3: ['Smooth as butter. Ten stars!', 'Best trip of my life!', 'Not a single bump. Bravo!', 'I didn’t even spill my tea.', 'Would launch again, immediately!', 'Pure first class. Who needs wings?'],
  2: ['A little bumpy, but we made it!', 'Fun ride! My hat is somewhere over Pebbleton.', 'Mostly smooth. Mostly.', 'Exciting! Perhaps a touch too exciting.', 'Good trip. The bird was a surprise.'],
  1: ['I think I left my stomach at 2 km.', 'Did we hit EVERY bird up there?', 'My hair will never be the same.', 'I would like to speak to the pilot.', 'Never again. Okay, maybe once more.'],
  crash: ['Well, at least the parachute worked.', 'I wanted to land, not to KABOOM!', 'Can I get a refund? And a new hat?'],
};
function pickReview(res) {
  const pool = (res.faces || []).filter(f => f !== 'buckley' && CHARS[f]);
  if (!pool.length || !res.route || !res.route.pax) return null;
  if (!res.delivered && !res.crashed) return null;
  const who = pool[Math.floor(Math.random() * pool.length)];
  const lines = res.crashed && !res.delivered ? REVIEWS.crash : REVIEWS[res.stars] || REVIEWS[2];
  return { who, stars: res.crashed && !res.delivered ? 0 : res.stars, text: lines[Math.floor(Math.random() * lines.length)] };
}

    const xl = `<text x="${x0 + 1}" y="${VH - 4}" class="lc-t">#${log[0].n}</text><text x="${VW - RP}" y="${VH - 4}" text-anchor="end" class="lc-t">#${log[n - 1].n} latest</text>`;

  function trailPreview(tr, locked) {
    const cnv = document.createElement('canvas'); cnv.width = 128; cnv.height = 128; cnv.className = 'r-ico'; cnv.style.width = '64px'; cnv.style.height = '64px';
    const c = cnv.getContext('2d'); c.scale(2, 2); rr(c, 2, 2, 60, 60, 14); c.fillStyle = tr.glow ? '#2b2a5a' : '#bfe9ff'; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
    c.save(); rr(c, 2, 2, 60, 60, 14); c.clip();
    for (let i = 0; i < 6; i++) {
      const y = 10 + i * 9, x = 32 + Math.sin(i * 1.3) * 5, r = 4 + i * 1.1;
      const col = tr.id === 'rainbow' ? `hsl(${i * 55},90%,72%)` : tr.glow || tr.col || '#ffffff';
      circ(c, x, y, r); c.fillStyle = col; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(43,34,64,.6)'; if (!tr.glow) c.stroke();
    }
    if (tr.extra === 'heart' || tr.extra === 'star4' || tr.extra === 'bubble') {
      for (const [x, y, r] of [[18, 22, 5], [46, 34, 6], [20, 48, 4]]) {
        c.save(); c.translate(x, y);
        if (tr.extra === 'heart') { c.beginPath(); c.moveTo(0, r * 0.9); c.bezierCurveTo(-r * 1.6, -r * 0.2, -r * 0.6, -r * 1.4, 0, -r * 0.5); c.bezierCurveTo(r * 0.6, -r * 1.4, r * 1.6, -r * 0.2, 0, r * 0.9); c.fillStyle = '#ff5a8a'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = INK; c.stroke(); }
        else if (tr.extra === 'star4') { c.beginPath(); for (let j = 0; j < 8; j++) { const a = j / 8 * TAU, q = j % 2 ? r * 0.35 : r; c.lineTo(Math.cos(a) * q, Math.sin(a) * q); } c.closePath(); c.fillStyle = '#ffd93d'; c.fill(); c.lineWidth = 1.2; c.strokeStyle = INK; c.stroke(); }
        else { circ(c, 0, 0, r); c.lineWidth = 1.5; c.strokeStyle = '#fff'; c.stroke(); c.fillStyle = '#fff'; circ(c, -r * 0.35, -r * 0.35, r * 0.25); c.fill(); }
        c.restore();
      }
    }
    if (tr.extra === 'doub') for (const [x, y, r] of [[17, 22, 5], [47, 32, 6], [21, 48, 4.5]]) { c.beginPath(); c.ellipse(x, y, r * 0.75, r, 0, 0, TAU); c.fillStyle = '#ffd93d'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = INK; c.stroke(); }
    if (tr.extra === 'spark') { c.strokeStyle = '#fff36b'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(16, 14); c.lineTo(22, 26); c.lineTo(17, 28); c.lineTo(24, 42); c.moveTo(46, 20); c.lineTo(42, 32); c.lineTo(48, 33); c.lineTo(43, 46); c.stroke(); }
    c.restore();
    c.save(); c.translate(32, 2); c.scale(0.3, 0.3); drawRocket(c, rocketLook(), { t: 0, faces: [], flame: false }); c.restore();
    if (locked) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-atop'; c.fillStyle = 'rgba(217,208,192,.65)'; c.fillRect(0, 0, 128, 128); }
    return cnv;
  }

      const rsx = P.fold ? W * (H <= 520 ? 0.4 : 0.45) : Math.max((P.l - 16) / 2 + 10, Math.min((P.sr + P.l) / 2, P.l - 120));
      tx = -(rsx - W / 2) / z; ta = H <= 520 ? 0.78 : 0.6;
      if (P.fold) ta = Math.min(ta, (P.t - 14 - ty * z) / H); // phones on their side: the pad stands just above the folded card
    }
    else if (H <= 520) { const panelW = Math.min(440, W * 0.54); const rsx = (W - panelW - 16) / 2; tx = -(rsx - W / 2) / z; ta = 0.78; }
    else if (W > 820) { const panelW = Math.min(640, W * 0.58); const rsx = (W - panelW - 32) / 2 + 10; tx = -(rsx - W / 2) / z; ta = 0.6; }
    else { ta = 0.24; ty = py * 0.95; }
  } else if (G.mode === 'title') { ta = 0.72; }
  G.cam.x += (tx - G.cam.x) * Math.min(1, dt * 4);
  G.cam.py += (ty - G.cam.py) * Math.min(1, dt * 4);
  G.cam.anchor += (ta - G.cam.anchor) * Math.min(1, dt * 4);
  if (chance(dt * 1.2)) G.parts.push({ k: 'smoke', x: rand(-30, 30), py: 6, vx: rand(-20, 20), vy: rand(10, 30), r: rand(4, 8), life: rand(1, 1.8), t: 0, col: '#ffffff' });
}
let lastT = performance.now() / 1000;
const DEBUG = { timeScale: 1, bot: false, frames: 0 };
function update(dt) {
  if (G.slowT > 0) { G.slowT -= dt; if (G.slowT <= 0) G.slow = 1; }
  const sdt = dt * G.slow;
  G.cam.shake = Math.max(0, G.cam.shake - dt * 40);
  G.cam.flash = Math.max(0, G.cam.flash - dt);
  G.hangarPop = Math.max(0, G.hangarPop - dt * 3);
  if (G.townPop) { G.townPop.t -= dt; if (G.townPop.t <= 0) G.townPop = null; }
  updatePokes(dt);
  updateCatch(dt);
  if (DEBUG.bot && G.mode === 'flight') botSteer();
  if (G.mode === 'launch') updateLaunch(sdt);
  else if (G.mode === 'flight') updateFlight(sdt);
  else if (G.mode === 'ending') updateEnding(sdt);
  else updateIdleCamera(dt);
  updateParticles(sdt);
  // music by altitude
  if ((G.mode === 'flight' || G.mode === 'ending') && G.R) { // flight -> space -> deep as you climb (never back down), boss gallop during a fight
    const R = G.R; R.musTier = Math.max(R.musTier || 0, R.alt > 110000 ? 2 : R.alt > 12000 ? 1 : 0);
    const fight = R.boss && R.boss.id !== 'whale' && G.mode === 'flight' && !R.boss.paid;
    const want = fight ? 'boss' : ['flight', 'space', 'deep'][R.musTier];
    if (Music.current !== want && ['flight', 'space', 'deep', 'boss'].includes(Music.current)) Music.play(want);
  }
  saveTimer += dt;
}
let frameErrs = 0;
function frame() {
  requestAnimationFrame(frame); // scheduled first, so one bad frame can never stop the game loop
  try {
    const now = performance.now() / 1000;
    let dt = Math.min(0.05, now - lastT); lastT = now;
    pollPad();
    if (G.paused) dt = 0;
    const n = DEBUG.timeScale > 1 ? Math.round(DEBUG.timeScale) : 1;
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { G.t += dt; update(dt); }
    render();
    DEBUG.frames++; DEBUG.ms = (DEBUG.ms || 0) * 0.95 + (performance.now() - t0) * 0.05; DEBUG.maxMs = Math.max(DEBUG.maxMs || 0, performance.now() - t0);
  } catch (e) { if (frameErrs++ < 5) setTimeout(() => { throw e; }); } // still reported, but the game keeps running
}

// a simple autopilot used for automated play-testing (window.__skyhop.bot = true)
function botSteer() {
  const R = G.R; let push = 0;
  const bs = R.boss;
  if (bs) {
    const rx = w2s(R.x, R.py)[0], u = G.cam.z;
    if (bs.id === 'storm') for (const k of bs.strikes) if (k.st === 'warn' && Math.abs(rx - k.x) < 100 * u) push += (rx >= k.x ? 1 : -1) * 4;
    if (bs.id === 'whale' && !bs.boosted && bs.hole) push += clamp((bs.hole[0] - rx) / (40 * u), -1.5, 1.5);
    if (bs.id === 'bandit' && !bs.leaveT) {
      if (bs.sw > 0.3 && bs.stun <= 0) push += clamp((bs.sx - rx) / (25 * u), -4, 4);
      const ry = w2s(R.x, R.py)[1];
      for (const k of bs.cans) if (!k.done && k.y < ry && ry - k.y < 320 * u && Math.abs(k.x - rx) < 70 * u) push += (rx >= k.x ? 1 : -1) * 3;
    }
    if (bs.id === 'gobble' && bs.mouth) { const k = bs.strikes.find(q => q.st === 'warn'); if (k) { if (Math.abs(rx - k.x) < bs.hw + 90 * u) push += (rx >= k.x ? 1 : -1) * 4; } else if (bs.pull > 0.1) push += Math.sign(rx - bs.mouth[0] || 1) * 2 * bs.pull; }
    if (bs.id === 'kraken') { const k = bs.strikes.find(q => q.st === 'come' && q.y < w2s(R.x, R.py)[1] + 10); if (k) push += clamp((k.gx - rx) / (25 * u), -4, 4); }
    if (bs.id === 'pirates' && bs.lane) { const k = bs.strikes.find(q => (q.st === 'warn' || (q.st === 'fire' && !q.hitDone)) && q.lanes); if (k) { let best = null; for (let i = 0; i < 5; i++) if (!k.lanes[i]) { const cx = bs.lane.l0 + (i + 0.5) * bs.lane.lw; if (best == null || Math.abs(cx - rx) < Math.abs(best - rx)) best = cx; } if (best != null) push += clamp((best - rx) / (20 * u), -4, 4); } }
  }
  for (const o of G.obs) {
    if (o.harmless || o.dead) continue;
    const dy = o.py - R.py; if (dy < -20 || dy > 420) continue;
    const dx = o.x - R.x; const rad = (o.w ? o.w * 0.5 : o.r) + 50;
    if (Math.abs(dx) < rad) push += (dx > 0 ? -1 : 1) * (1 - dy / 420) * 3;
  }
  if (Math.abs(push) < 0.3) { // drift toward coins/rings
    let best = null, bd = 1e9;
    for (const p of G.picks) { const dy = p.py - R.py; if (dy < 0 || dy > 500) continue; const d = Math.abs(p.x - R.x) + dy * 0.5; if (d < bd) { bd = d; best = p; } }
    if (best) push = clamp((best.x - R.x) / 80, -1, 1);
  }
  G.input.keys.ArrowLeft = push < -0.25; G.input.keys.ArrowRight = push > 0.25;
  if (G.st.dash && R.dashCd <= 0 && Math.abs(push) > 2.2) tryDash(push > 0 ? 1 : -1);
  if (G.st.ab && R.abCd <= 0 && R.fuel > 0) tryAfterburner();
}

// ================================================================ BOOT
loadSave();
if (!S.mailGot && S.flights > 0) { S.mailGot = {}; S.mail = []; const due = MAIL.filter(m => { try { return m.when(); } catch (e) { return false; } }); for (const m of due) S.mailGot[m.id] = 1; const last = due.filter(m => ROUTES.some(r => r.id === m.id)).pop(); if (last) S.mail.push(last.id); }
if (!S.met) { S.met = {}; for (const r of ROUTES) if (routeDone(r.id)) for (const f of (r.pax ? r.who.slice(0, r.pax) : ['buckley'])) S.met[f] = 1; }
resize();
G.st = computeStats(); G.look = rocketLook();
G.cam.py = padRestPy(G.look); G.cam.anchor = 0.72; G.cam.z = worldZoom();
UI.showScreen('title');
if (S.seen.intro) {
  $('btn-start').textContent = 'Continue';
  const nr = nextRoute(), nDone = MAIN_ROUTES.filter(r => routeDone(r.id)).length, fDone = FRONT_ROUTES.filter(r => routeDone(r.id)).length;
  $('title-foot').innerHTML = `Welcome back! ${S.flights} flights · best <b>${fmtAlt(S.bestAlt)}</b> · ${frontierOpen() ? `frontier ${fDone}/${FRONT_ROUTES.length}` : `${nDone}/${MAIN_ROUTES.length} routes`}${nr ? ` · next: <b>${nr.to}</b>` : chartsOpen() ? ` · constellations <b>${chartedN()}/${STAR_CHARTS.length}</b>` : ' · the whole map!'}`;
  if (dailyUnlocked()) { const d = todaysDaily(); const pill = document.createElement('div'); pill.className = 'title-daily'; pill.innerHTML = d.done ? `Today's special delivered! Come back tomorrow.` : `Today's special: <b>${d.cargo}</b> for ${d.to} · ${fmtAlt(d.target)}${dailyStreakAlive() ? ` · ${dailyStreakAlive()}-day streak` : ''}`; document.querySelector('#scr-title .tagline').after(pill); }
}
Music.play('title');
// home-screen icon and app manifest, drawn in code so "Add to Home Screen" gives a proper app icon
try {
  const icon = size => {
    const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), k = size / 180;
    const g = x.createLinearGradient(0, 0, 0, size); g.addColorStop(0, '#5ec8ff'); g.addColorStop(1, '#bfe9ff'); x.fillStyle = g; x.fillRect(0, 0, size, size);
    x.fillStyle = '#ffd93d'; x.strokeStyle = INK; x.lineWidth = 5 * k; x.beginPath(); x.arc(142 * k, 38 * k, 20 * k, 0, TAU); x.fill(); x.stroke();
    x.fillStyle = '#6cc35f'; x.fillRect(0, 150 * k, size, 30 * k);
    x.save(); x.translate(86 * k, 96 * k); x.rotate(0.35); x.scale(1.2 * k, 1.2 * k); drawRocket(x, rocketLook(), { t: 0.3, throttle: 1, faces: ['ada'] }); x.restore();
    return c.toDataURL('image/png');
  };
  const add = (rel, href, extra) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (extra) for (const k in extra) l.setAttribute(k, extra[k]); document.head.appendChild(l); };
  add('apple-touch-icon', icon(180));
  const man = { name: 'Skyhop Express', short_name: 'Skyhop', display: 'fullscreen', orientation: 'any', background_color: '#7fd4ff', theme_color: '#7fd4ff', start_url: location.href.split('#')[0],
    icons: [{ src: icon(192), sizes: '192x192', type: 'image/png' }, { src: icon(512), sizes: '512x512', type: 'image/png' }] };
  add('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)));
} catch (e) { /* icons are a nice-to-have */ }
// if something ever breaks, say so once (with the detail, to help bug reports) instead of failing silently
let errToastShown = false;
window.addEventListener('error', e => {
  if (errToastShown || !e || !e.message) return; errToastShown = true;
  try { saveGame(); toast(`<b>Oops, a gremlin got into the gears.</b> Your progress is saved. <small>(${String(e.message).replace(/[<>&]/g, '').slice(0, 90)})</small>`, 6000, true); } catch (err) { /* nothing more we can do */ }
});
requestAnimationFrame(frame);

// debug / test hooks
window.__skyhop = {
  G, DEBUG, RIVAL, SKY_EVENTS, BOSSES, get S() { return S; }, computeStats, simulateFlight, UPGRADES, ROUTES, UP, art: { drawStation, routeIconCanvas, drawFace, makePostcard, guideIcon, GUIDE },
  set bot(v) { DEBUG.bot = v; }, set timeScale(v) { DEBUG.timeScale = v; }, set season(v) { DEBUG.season = v; },
  setMoney(v) { S.money = v; if (UI.current === 'hangar') UI.refresh(); },
  setLevel(id, l) { S.up[id] = l; G.look = rocketLook(); G.st = computeStats(); if (UI.current === 'hangar') UI.refresh(); },
  done(id) { S.routes[id] = { done: true, stars: 3, runs: 1 }; const nx = nextRoute(); S.route = nx ? nx.id : 'free'; },
  start: startGame, launch(v = 0.8) { $('scr-results').classList.add('hidden'); if (G.mode !== 'launch') enterLaunch(); G.launch.v = v; doLaunch(); },
  hangar: () => goHangar(true), flush: () => UI.flushPending(), reset() { resetSave(); }, LOST, drawLostItem, mail: () => UI.openLetter(),
  daily() { return todaysDaily(); }, toast, floater, UI, AudioSys,
  skyEvent(id) { DEBUG.forceEvent = id; },
  crash() { if (G.R && G.mode === 'flight') crash(); },
  teleport(alt) { const R = G.R; if (!R) return; R.alt = alt; R.maxAlt = Math.max(R.maxAlt, alt); },
  save: saveGame, music: Music, audio: AudioSys, sfxTest() { const errs = []; for (const k in AudioSys.sfx) { try { AudioSys.sfx[k](); } catch (e) { errs.push(k + ':' + e.message); } } return errs; },
  autoPlan: (b) => autoPlan(b),
  candidates() { return UPGRADES.filter(u => upState(u) === 'open').map(u => ({ id: u.id, cost: upCost(u) })); },
  buy(id) { const u = UP[id]; const c = upCost(u); if (upState(u) !== 'open' || c > S.money) return false; S.money -= c; S.up[id] = lvl(id) + 1; G.look = rocketLook(); G.st = computeStats(); saveGame(); return true; },
};
})();
</script>
