<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd4ff">
<meta name="description" content="Skyhop Express: build a passenger rocket line from Grandma Ada's backyard to the stars.">
<title>Skyhop Express</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4c10 8 14 20 14 32H18C18 24 22 12 32 4z' fill='%23fff6e5' stroke='%232b2240' stroke-width='4'/%3E%3Ccircle cx='32' cy='26' r='6' fill='%234d96ff' stroke='%232b2240' stroke-width='3'/%3E%3Cpath d='M18 36l-8 14h12zM46 36l8 14H42z' fill='%23ff5a5f' stroke='%232b2240' stroke-width='3'/%3E%3Cpath d='M26 46l6 14 6-14z' fill='%23ffd93d' stroke='%232b2240' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#2b2240; --ink2:#4a3f66; --cream:#fff6e5; --paper:#fffaf0;
  --red:#ff5a5f; --orange:#ff9f43; --yellow:#ffd93d; --green:#5fd068; --teal:#2ec4b6;
  --blue:#4d96ff; --purple:#9b5de5; --pink:#f15bb5; --sky:#7fd4ff; --gold:#ffc83d;
  --font:"Fredoka","Baloo 2","Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#7fd4ff;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.screen{position:absolute;inset:0;pointer-events:none}
.screen > *{pointer-events:auto}
.hidden{display:none!important}
button{font-family:var(--font)}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink),0 14px 30px rgba(20,10,50,.25)}
.btn{font-weight:800;font-size:18px;letter-spacing:.3px;border:4px solid var(--ink);border-radius:16px;padding:9px 18px;
  background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;position:relative;
  transition:transform .07s,box-shadow .07s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:26px;padding:12px 26px;border-radius:20px}
.btn.go{background:var(--green)}
.btn.blue{background:var(--blue);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn:disabled{filter:grayscale(.85) opacity(.65);cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.small{font-size:15px;padding:6px 12px;border-radius:13px;flex:0 0 auto}
.btn.off{filter:grayscale(.85) opacity(.6)}
.seg{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
@media (max-width:480px){.seg{gap:5px}.seg .btn.small{padding:5px 9px;font-size:13px}}
.route .r-ico canvas{width:64px;height:64px;display:block}
.icon-btn{width:46px;height:46px;border:4px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--ink);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .07s,box-shadow .07s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:26px;height:26px}
.icon-btn.off{opacity:.55}
.icon-btn.off::after{content:"";position:absolute;width:30px;height:4px;background:var(--red);transform:rotate(-45deg);border-radius:2px}

/* ---------- Title ---------- */
#scr-title{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:max(7vh,30px)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;transform:rotate(-4deg);pointer-events:none;
  animation:logoBob 3s ease-in-out infinite}
.logo span{font-weight:900;font-size:clamp(54px,12vw,118px);letter-spacing:2px;color:var(--yellow);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink),0 18px 30px rgba(0,0,40,.35)}
.logo .l2{color:var(--red);font-size:clamp(40px,8.5vw,84px);margin-left:18%}
.tagline{margin-top:20px;background:var(--ink);color:var(--cream);font-weight:800;padding:6px 16px;border-radius:999px;font-size:clamp(14px,2.4vw,20px);
  transform:rotate(-2deg);pointer-events:none}
#title-bottom{position:absolute;bottom:max(8vh,30px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
#title-bottom > *{pointer-events:auto}
#btn-start{animation:pulse 1.4s ease-in-out infinite}
.title-foot{font-weight:800;color:var(--ink);background:rgba(255,246,229,.85);padding:6px 14px;border-radius:12px;font-size:14px;border:3px solid var(--ink);max-width:calc(100vw - 32px);text-align:center;box-sizing:border-box}
.title-daily{font-weight:800;color:var(--ink);background:#ffe3f1;padding:5px 12px;border-radius:999px;font-size:13px;border:3px solid var(--ink);max-width:calc(100vw - 32px);text-align:center;box-sizing:border-box;margin-top:22px;transform:rotate(2deg);box-shadow:0 4px 0 var(--ink)}
@media (max-width:600px){#scr-title{padding-top:max(7vh,30px,74px)}#title-tools{top:10px;right:10px}#title-tools .icon-btn{transform:scale(.85);transform-origin:top right}}
#title-tools{position:absolute;top:14px;right:14px;display:flex;gap:10px}
@keyframes logoBob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- Hangar ---------- */
#scr-hangar .side{position:absolute;right:16px;top:16px;bottom:16px;width:min(580px,54vw);display:flex;flex-direction:column;overflow:hidden}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 14px;gap:8px;flex:0 0 auto}
.money{display:flex;align-items:center;gap:8px;font-weight:900;font-size:28px;background:var(--ink);color:var(--yellow);padding:4px 14px 4px 6px;border-radius:999px}
.money .coin{width:30px;height:30px}
.money.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.15)}}
.head-btns{display:flex;gap:8px;position:relative}
.head-btns .icon-btn{position:relative}
.badge-dot{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:11px;font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:1px 5px;line-height:1.1}
#tabs{display:flex;gap:6px;padding:4px 12px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:0 0 auto;min-height:44px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:4px solid var(--ink);border-bottom:none;border-radius:14px 14px 0 0;padding:6px 10px 6px 8px;
  background:#e9dcc4;font-weight:800;font-size:15px;cursor:pointer;position:relative;color:var(--ink2);transform:translateY(4px)}
.tab svg{width:24px;height:24px}
.tab.active{background:var(--paper);color:var(--ink);transform:translateY(4px);z-index:2}
#tabs.compact .tab:not(.active) span:not(.badge-dot){display:none}
#tabs.compact .tab{padding:6px 8px}
.tab .badge-dot{top:-9px;right:-6px}
.tab.new-tab{animation:tabGlow 1.2s ease-in-out infinite}
@keyframes tabGlow{50%{background:#fff3b0}}
#tree{position:relative;flex:1 1 auto;min-height:110px;background:var(--paper);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);overflow:auto;
  background-image:radial-gradient(circle,rgba(43,34,64,.09) 1.5px,transparent 2px);background-size:22px 22px}
#tree-inner{position:relative;margin:0 auto}
#tree-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.node{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transform:translate(-50%,-50%)}
.node .nbox{width:66px;height:66px;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;
  position:relative;transition:transform .1s}
.node .nbox svg{width:46px;height:46px}
.node:hover .nbox{transform:translateY(-2px)}
.node.sel .nbox{outline:4px solid var(--blue);outline-offset:3px}
.node.can .nbox{background:#fffbe0;animation:canGlow 1.6s ease-in-out infinite}
@keyframes canGlow{50%{box-shadow:0 4px 0 var(--ink),0 0 0 6px rgba(255,217,61,.55)}}
.node.max .nbox{background:linear-gradient(160deg,#fff4c2,#ffd96a)}
.node.locked .nbox{background:#d9d0c0}
.node.locked .nbox svg{opacity:.35;filter:grayscale(1)}
.node.forkout .nbox{background:#e6e0d6}
.node.forkout .nbox svg{opacity:.4;filter:grayscale(1)}
.node .nlabel{margin-top:6px;font-weight:800;font-size:12px;text-align:center;line-height:1.05;background:rgba(255,250,240,.9);padding:1px 4px;border-radius:6px;max-width:92px}
.pips{display:flex;gap:2px;margin-top:3px}
.pip{width:7px;height:7px;border-radius:2px;border:1.5px solid var(--ink);background:#fff}
.pip.on{background:var(--green)}
.node .lock{position:absolute;right:-8px;bottom:-8px;width:24px;height:24px}
.node .newb{position:absolute;top:-10px;left:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:900;border:3px solid var(--ink);border-radius:8px;padding:0 4px;transform:rotate(-10deg)}
#tree.compact .node .nbox{width:54px;height:54px;border-radius:15px}
#tree.compact .node .nbox svg{width:36px;height:36px}
#tree.compact .node .nlabel{font-size:11px;margin-top:4px}
.orb{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:var(--yellow);font-weight:900;font-size:13px;border-radius:999px;padding:2px 8px;pointer-events:none}
#detail{padding:10px 14px;display:flex;gap:12px;align-items:flex-start;min-height:118px;flex:0 0 auto}
#detail .dicon{flex:0 0 auto;width:74px;height:74px;border:4px solid var(--ink);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center}
#detail .dicon svg{width:54px;height:54px}
#detail .dbody{flex:1 1 auto;min-width:0}
#detail h3{font-size:21px;font-weight:900;line-height:1.05;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#detail .lvl{font-size:13px;background:var(--ink);color:var(--cream);padding:2px 8px;border-radius:999px}
#detail p{font-size:14px;line-height:1.25;margin:4px 0 6px;color:var(--ink2);font-weight:700}
#detail .fx{font-size:14px;font-weight:800;color:var(--ink)}
#detail .fx b{color:#1d9e4c}
#detail .dact{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center;align-self:center}
#detail .dact .btn{font-size:17px;padding:8px 14px}
#detail .note{font-size:12px;font-weight:800;color:var(--purple)}
.side-foot{display:flex;gap:10px;align-items:center;padding:10px 12px 12px;flex:0 0 auto}
#route-chip{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:6px 10px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
#route-chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#route-chip .rc-ico{flex:0 0 auto;width:40px;height:40px}
#route-chip .rc-t{min-width:0}
#route-chip .rc-k{font-size:11px;font-weight:900;color:var(--purple);text-transform:uppercase;letter-spacing:.6px}
#route-chip .rc-n{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#route-chip .rc-s{font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btn-launch{animation:pulse 1.6s ease-in-out infinite}
#statcard{position:absolute;left:16px;top:16px;padding:10px 14px;min-width:200px;font-weight:800;font-size:14px}
#statcard h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--purple);margin-bottom:4px}
#statcard .row{display:flex;justify-content:space-between;gap:16px;line-height:1.5}
#statcard .row span:last-child{color:var(--ink)}
#statcard .best{margin-top:6px;padding-top:6px;border-top:3px dashed rgba(43,34,64,.25)}
#statcard .jobs{margin-top:8px;padding-top:8px;border-top:3px dashed rgba(43,34,64,.25);cursor:pointer;max-width:250px}
#statcard .jobs:hover h4{text-decoration:underline}
#statcard .job{display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:1.3;margin:3px 0}
#statcard .job b{color:var(--purple)}
#statcard .job .jp{color:#1d9e4c;white-space:nowrap}
@media (max-width:820px) and (min-height:521px){
  #scr-hangar .side{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:min(66%,600px)}
}
@media (max-width:820px),(max-height:520px){
  #statcard{display:none}
  .money{font-size:22px}
  .head-btns{gap:6px}
  .head-btns .icon-btn{width:40px;height:40px;border-radius:12px}
  .head-btns .icon-btn svg{width:22px;height:22px}
  .side-head{padding:8px 10px 4px}
  #detail{min-height:86px;padding:8px 10px;gap:8px}
  #detail h3{font-size:17px}
  #detail p{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 3px}
  #detail .fx{font-size:12px}
  #detail .dicon{width:54px;height:54px;border-radius:14px}
  #detail .dicon svg{width:40px;height:40px}
  #detail .dact .btn{font-size:15px;padding:7px 10px}
  .side-foot{padding:8px 10px 10px}
  #route-chip{padding:4px 8px}
  #route-chip .rc-n{font-size:14px}
  .toast{font-size:13px;padding:6px 12px}
  .rc-pre{display:none}
  .btn.big{font-size:22px;padding:10px 18px}
}
@media (max-width:440px){
  .money{font-size:19px;padding:3px 10px 3px 4px;gap:5px}
  .money .coin{width:24px;height:24px}
  .head-btns{gap:5px}
  .head-btns .icon-btn{width:36px;height:36px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
  .head-btns .icon-btn svg{width:20px;height:20px}
}
/* short landscape screens (phones on their side): full-height side panel */
@media (max-height:520px){
  #scr-hangar .side{left:auto;right:8px;top:6px;bottom:6px;height:auto;width:min(440px,54vw)}
  .side-head{padding:6px 8px 2px}
  .money{font-size:18px;padding:2px 10px 2px 4px}
  .money .coin{width:22px;height:22px}
  .head-btns{gap:5px}
  .head-btns .icon-btn{width:34px;height:34px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
  .head-btns .icon-btn svg{width:19px;height:19px}
  #tabs{min-height:38px;padding-top:2px}
  .tab{padding:4px 8px;font-size:13px}
  .tab svg{width:20px;height:20px}
  #tree{min-height:70px}
  #detail{min-height:70px;padding:6px 8px}
  #detail .dicon{width:44px;height:44px}
  #detail .dicon svg{width:32px;height:32px}
  #detail h3{font-size:15px}
  #detail p{-webkit-line-clamp:1}
  .side-foot{padding:6px 8px 8px;gap:8px}
  #route-chip .rc-ico{width:30px;height:30px}
  #route-chip .rc-s{display:none}
  .btn.big{font-size:19px;padding:8px 14px}
  body.in-hangar #toasts{left:calc((100vw - min(440px,54vw) - 16px)/2)}
  .toast{font-size:12px;padding:5px 10px;max-width:42vw}
  body.in-flight #toasts{top:auto;bottom:10px}
  body.in-flight .toast{font-size:12px;padding:4px 10px;max-width:44vw;border-width:2px}
}

/* ---------- Generic overlay ---------- */
.overlay{position:absolute;inset:0;z-index:10;background:rgba(30,18,60,.45);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.overlay .panel{max-width:560px;width:100%;max-height:100%;display:flex;flex-direction:column}
.ov-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.ov-head h2{font-size:28px;font-weight:900}
.ov-body{padding:4px 16px 16px;overflow:auto}

/* ---------- Route map ---------- */
#scr-map .panel{max-width:620px;height:min(92vh,820px)}
#map-list{position:relative;padding:6px 6px 16px 6px}
.route{display:flex;gap:12px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 12px;margin:0 0 14px 0;position:relative;box-shadow:0 4px 0 var(--ink)}
.route.cur{background:#fffbe0;outline:4px solid var(--yellow);outline-offset:2px}
.route.locked{background:#e4dccd}
.route.locked .r-ico,.route.locked .r-main{opacity:.6}
.route .r-ico{flex:0 0 auto;width:64px;height:64px}
.route .r-main{flex:1 1 auto;min-width:0}
.route .r-name{font-size:19px;font-weight:900;line-height:1.05}
.route .r-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:12px;font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:1px 8px;background:var(--paper);white-space:nowrap}
.chip.alt{background:#d8f0ff}.chip.pax{background:#ffe3f1}.chip.pay{background:#fff1b8}.chip.warn{background:#ffd0d0}.chip.ok{background:#d7f7dc}.chip.twist{background:#ead9ff}.chip.streak{background:#ffb4a2;font-size:11px;vertical-align:2px}.route.daily{background:linear-gradient(135deg,#fff6e5 60%,#ffe3f1)}.route .twists{margin-top:5px}.route .twists .chip{font-size:11px;margin-right:2px}
.ach-bar{position:relative;height:16px;margin-top:6px;border:3px solid var(--ink);border-radius:999px;background:#efe6d6;overflow:hidden}
.ach-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4fd8ff,#5fd068)}
.ach-bar span{position:relative;display:block;text-align:center;font-size:10px;font-weight:900;line-height:10px}
.route .r-desc{font-size:13px;font-weight:700;color:var(--ink2);margin-top:5px;line-height:1.2}
.route .stars{font-size:18px;letter-spacing:1px;color:#c9bca3;-webkit-text-stroke:1px var(--ink)}
.route .stars .on{color:var(--yellow)}
.route .r-act{flex:0 0 auto}
.route-link{position:absolute;left:44px;width:6px;height:18px;background:repeating-linear-gradient(var(--ink) 0 4px,transparent 4px 8px);top:-18px}
.route:first-child .route-link{display:none}

/* ---------- Results ---------- */
#scr-results .panel{max-width:440px}
.res-snap{position:absolute;top:12px;right:12px;z-index:2}
#scr-results .panel{position:relative}
.res-title{text-align:center;font-size:34px;font-weight:900;padding:14px 10px 0;line-height:1}
.res-sub{text-align:center;font-weight:800;color:var(--ink2);font-size:15px;margin-top:4px}
.res-rows{padding:10px 18px 4px}
.res-row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;padding:5px 0;border-bottom:3px dashed rgba(43,34,64,.15);opacity:0;transform:translateX(-10px);transition:all .25s}
.res-row.show{opacity:1;transform:none}
.res-row .v{font-weight:900}
.res-row.total{font-size:24px;border-bottom:none;padding-top:10px}
.res-row.total .v{color:#1d9e4c}
.res-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px 14px 0}
.res-badge{font-weight:900;font-size:14px;border:3px solid var(--ink);border-radius:12px;padding:3px 10px;background:var(--yellow);transform:rotate(-2deg);animation:pop .4s backwards}
.res-badge:nth-child(2n){transform:rotate(2deg);background:var(--pink);color:#fff}
.res-badge:nth-child(3n){background:var(--teal);color:#fff}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}}
.res-review{display:flex;gap:10px;align-items:center;margin:10px 18px 0;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;line-height:1.2;animation:pop .4s .5s backwards}
.res-review canvas{width:44px;height:44px;flex:0 0 auto}
.rv-s{color:#e0a800;font-size:15px;letter-spacing:1px}
.rv-s span{color:var(--ink2);font-size:12px;letter-spacing:0;margin-left:4px}
#scr-results .panel{overflow-y:auto}
@media (max-height:520px) and (min-width:540px){
  #scr-results .panel{max-width:820px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"title rows" "sub rows" "badges rows" "review rows" "goal btns";grid-template-rows:auto auto auto 1fr auto;column-gap:6px}

<script>
(() => {
'use strict';

/* =====================================================================
   SKYHOP EXPRESS — a tiny rocket company game
   Everything (art, sound, music) is generated in code.
   ===================================================================== */

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smooth = t => t * t * (3 - 2 * t);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function fmtInt(n) { return Math.round(n).toLocaleString('en-US'); }
function fmtMoney(n) {
  n = Math.round(n);
  if (n < 100000) return '$' + fmtInt(n);
  if (n < 1e6) return '$' + (n / 1000).toFixed(n < 1e6 ? 1 : 0).replace(/\.0$/, '') + 'K';
  if (n < 1e9) return '$' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return '$' + (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
}
function fmtAlt(m) {
  m = Math.max(0, m);
  if (m < 10000) return fmtInt(m) + ' m';
  if (m < 100000) return (m / 1000).toFixed(1) + ' km';
  return fmtInt(m / 1000) + ' km';
}
function fmtSpeed(v) { return fmtInt(Math.abs(v)) + ' m/s'; }

function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgbStr(c, a = 1) { return a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixHex(a, b, t) { return rgbStr(mixRGB(hex2rgb(a), hex2rgb(b), t)); }

// deterministic pseudo random (for stable backgrounds)
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
function srand(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }

// ----------------------------------------------------------------- save
const SAVE_KEY = 'skyhop_express_save_v1';
function defaultSave() {
  return {
    v: 1, money: 0, earned: 0, flights: 0, bestAlt: 0,
    up: {},            // upgrade id -> level
    routes: {},        // route id -> {done, stars, runs}
    route: 'r0',       // selected route id ('free' = free flight)
    seen: {},          // story / disclosure flags
    viewed: {},        // upgrade nodes the player has looked at
    tabsSeen: {},
    stats: { coins: 0, hits: 0, perfect: 0, rings: 0, smashed: 0, pax: 0, time: 0, jobs: 0, nights: 0, close: 0, pokes: 0, king: 0, whale: 0, kraken: 0, daily: 0, wishes: 0 },
    ach: {},
    cond: 'clear', jobs: [], avg: { coins: 8, rings: 0.6, close: 0.6, alt: 500, v: 110, total: 110, smash: 0 },
    settings: { music: true, sfx: true, shake: true, ghost: true },
    ghosts: {},        // route id -> {alt, step, a:[alt...], x:[x...]} best run replay
    ended: false,
  };
}
let S = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      const def = defaultSave();
      S = Object.assign(def, d);
      S.stats = Object.assign(def.stats, d.stats || {});
      S.settings = Object.assign(def.settings, d.settings || {});
      S.avg = Object.assign(def.avg, d.avg || {});
    }
  } catch (e) { S = defaultSave(); }
}
let saveTimer = 0;
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function resetSave() { S = defaultSave(); saveGame(); }

// ================================================================ AUDIO
const AudioSys = (() => {
  let ac = null, master, comp, sfxBus, musBus, noiseBuf = null;
  let engNoise, engFilter, engGain, engOsc, engOscGain, windNoise, windFilter, windGain;
  let enabledSfx = true, enabledMusic = true;
  const MUS_VOL = 0.32, SFX_VOL = 0.75;

  function init() {
    if (ac) { resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ac.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = enabledSfx ? SFX_VOL : 0; sfxBus.connect(master);
    musBus = ac.createGain(); musBus.gain.value = enabledMusic ? MUS_VOL : 0; musBus.connect(master);
    // noise buffer
    const len = ac.sampleRate * 2;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // engine loop
    engNoise = ac.createBufferSource(); engNoise.buffer = noiseBuf; engNoise.loop = true;
    engFilter = ac.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 400; engFilter.Q.value = 0.8;
    engGain = ac.createGain(); engGain.gain.value = 0;
    engNoise.connect(engFilter); engFilter.connect(engGain); engGain.connect(sfxBus);
    engOsc = ac.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 48;
    const engOscF = ac.createBiquadFilter(); engOscF.type = 'lowpass'; engOscF.frequency.value = 160;
    engOscGain = ac.createGain(); engOscGain.gain.value = 0;
    engOsc.connect(engOscF); engOscF.connect(engOscGain); engOscGain.connect(sfxBus);
    engNoise.start(); engOsc.start();
    // wind loop
    windNoise = ac.createBufferSource(); windNoise.buffer = noiseBuf; windNoise.loop = true; windNoise.playbackRate.value = 0.7;
    windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 800; windFilter.Q.value = 0.6;
    windGain = ac.createGain(); windGain.gain.value = 0;
    windNoise.connect(windFilter); windFilter.connect(windGain); windGain.connect(sfxBus);
    windNoise.start();
    Music._attach();
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); }
  function suspend() { if (ac && ac.state === 'running') ac.suspend().catch(() => {}); }
  function now() { return ac ? ac.currentTime : 0; }

  function setSfx(on) { enabledSfx = on; if (ac) sfxBus.gain.setTargetAtTime(on ? SFX_VOL : 0, ac.currentTime, 0.05); }
  function setMusic(on) { enabledMusic = on; if (ac) musBus.gain.setTargetAtTime(on ? MUS_VOL : 0, ac.currentTime, 0.1); }

  // generic tone with envelope
  function tone(o) {
    if (!ac) return;
    const t = (o.t != null ? o.t : ac.currentTime) + (o.delay || 0);
    const dur = o.dur || 0.2, vol = o.vol == null ? 0.3 : o.vol;
    const osc = ac.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f || 440, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + (o.slide || dur));
    if (o.detune) osc.detune.value = o.detune;
    const g = ac.createGain();
    const a = o.attack || 0.005;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.filter) { const fl = ac.createBiquadFilter(); fl.type = o.filter; fl.frequency.value = o.ff || 2000; fl.Q.value = o.q || 1; osc.connect(fl); node = fl; }
    node.connect(g); g.connect(o.dest || sfxBus);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  function noise(o) {
    if (!ac) return;
    const t = (o.t != null ? o.t : ac.currentTime) + (o.delay || 0);
    const dur = o.dur || 0.3, vol = o.vol == null ? 0.3 : o.vol;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = o.rate || 1;
    src.loopStart = 0; src.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = o.filter || 'lowpass'; fl.Q.value = o.q || 1;
    fl.frequency.setValueAtTime(o.f || 1200, t);
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(o.dest || sfxBus);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
  }
  const N = m => 440 * Math.pow(2, (m - 69) / 12);

  // throttle limits for very frequent sounds
  const lastPlay = {};
  function gate(name, gap) { const t = performance.now(); if (lastPlay[name] && t - lastPlay[name] < gap) return false; lastPlay[name] = t; return true; }

  const sfx = {
    click() { tone({ type: 'triangle', f: 700, f2: 1100, dur: 0.07, vol: 0.18 }); },
    tab() { tone({ type: 'triangle', f: 520, f2: 640, dur: 0.06, vol: 0.14 }); },
    deny() { tone({ type: 'square', f: 180, f2: 120, dur: 0.18, vol: 0.12, filter: 'lowpass', ff: 900 }); },
    coin(pitch = 0) {
      if (!gate('coin', 35)) return;
      const b = 83 + Math.min(pitch, 10);
      tone({ type: 'square', f: N(b), dur: 0.07, vol: 0.09, filter: 'lowpass', ff: 4000 });
      tone({ type: 'square', f: N(b + 5), dur: 0.22, vol: 0.09, delay: 0.06, filter: 'lowpass', ff: 4000 });
    },
    bigcoin() { [0, 4, 7, 12, 16].forEach((s, i) => tone({ type: 'triangle', f: N(84 + s), dur: 0.25, vol: 0.14, delay: i * 0.05 })); },
    fuel() { tone({ type: 'sine', f: 220, f2: 520, dur: 0.18, vol: 0.25 }); tone({ type: 'sine', f: 330, f2: 780, dur: 0.16, vol: 0.18, delay: 0.08 }); },
    repair() { [0, 7, 12].forEach((s, i) => tone({ type: 'triangle', f: N(72 + s), dur: 0.18, vol: 0.18, delay: i * 0.06 })); noise({ dur: 0.08, vol: 0.12, filter: 'highpass', f: 3000 }); },
    ring(n = 0) {
      const b = 76 + (n % 5) * 2;
      [0, 4, 7, 11].forEach((s, i) => tone({ type: 'sine', f: N(b + s), dur: 0.35, vol: 0.12, delay: i * 0.03 }));
      noise({ dur: 0.35, vol: 0.12, filter: 'bandpass', f: 1500, f2: 6000, q: 2 });
    },
    hit() {
      noise({ dur: 0.35, vol: 0.5, filter: 'lowpass', f: 2500, f2: 200 });
      tone({ type: 'sine', f: 160, f2: 40, dur: 0.3, vol: 0.5 });
      tone({ type: 'square', f: 90, f2: 50, dur: 0.15, vol: 0.12 });
    },
    smash() { noise({ dur: 0.18, vol: 0.35, filter: 'bandpass', f: 1800, f2: 400, q: 1.2 }); tone({ type: 'triangle', f: 600, f2: 200, dur: 0.12, vol: 0.12 }); },

// ---- stat curves (shared by UI text and physics)
const STAT = {
  thrust: l => 40 * Math.pow(1.36, l),
  burnRate: l => 10 * Math.pow(1.1, l),
  fuelCap: l => 40 * Math.pow(1.3, l),
  boostPct: l => 0.6 + 0.25 * l,
  boostTime: l => 1.6 + 0.6 * l,
  abDur: l => 1.2 + 0.3 * l,
  abCd: l => Math.max(4, 11 - 2 * l),
  stage2Pct: l => 0.35 + 0.15 * l,
  warpDrag: l => Math.pow(0.72, l),
  hp: l => 3 + l,
  drag: l => Math.pow(0.74, l),
  repair: l => Math.max(6, 22 - 4 * l),
  shieldCd: l => Math.max(5, 15 - 3 * l),
  magnet: l => l ? 60 + l * 45 : 0,
  kick: (l, rail) => 25 + l * 22 + rail,
  railKick: l => l * 110,
  startAlt: l => l * 650,
  gift: l => l ? Math.round(15 * Math.pow(3, l - 1) * (1 + Math.pow(S.bestAlt, 0.7) / 200)) : 0,
  seats: l => [1, 2, 3, 4, 6, 8, 10, 12][l],
};

function upCost(u, l = lvl(u.id)) { return Math.round(u.base * Math.pow(u.g, l) / 5) * 5; }
function forkChoice(fork) { const u = UPGRADES.find(x => x.fork === fork && lvl(x.id) > 0); return u ? u.id : null; }
function spentOn(u) { let s = 0; for (let i = 0; i < lvl(u.id); i++) s += upCost(u, i); return s; }

// node state for the tree: hidden | locked | forkout | open | max
function upState(u) {

  flock:    { name: 'MIGRATION!', col: '#bff8ff', sub: 'BIRDS INCOMING', dur: 6, min: 250, max: 3800, w: 2 },

        sfx.thunder(); G.cam.flash = 0.25; G.cam.flashCol = '#d8d0ff';

  if (o.type === 'bird') { sfx.squawk(); for (let i = 0; i < 6; i++) G.parts.push({ k: 'feather', x: o.x, py: o.py, vx: rand(-120, 120), vy: rand(-40, 140), r: 5, life: 1.2, t: 0, col: o.col, rot: rand(0, TAU), vr: rand(-6, 6) }); }
  if (R.hp <= 0) crash();
}
function crash() {

  R.capsule = { x: R.x, py: R.py, vx: rand(-60, 60), vy: 260, chute: 0 };

}
function dock() {

  R.delivered = true;

function updatePickups(dt) {
  const R = G.R, st = G.st, sc = G.rocketScale;
  const camBottom = G.cam.py - (H * (1 - G.cam.anchor)) / G.cam.z;
  const reach = 30 * sc;
  for (const p of G.picks) {
    if (p.dead) continue;
    const dx = R.x - p.x, dy = R.py - p.py, dist = Math.hypot(dx, dy);
    if (st.magnet && p.type !== 'ring' && dist < st.magnet && !R.crashed) { const pull = (1 - dist / st.magnet) * 900 + 200; p.x += dx / dist * pull * dt; p.py += dy / dist * pull * dt; }
    if (p.py < camBottom - 200) { p.dead = true; continue; }
    if (R.crashed) continue;
    if (S.flights > 0 && p.py - R.py < 340 && p.py - R.py > 0) tipOnce(p.type);
    if (p.type === 'ring') {
      if (!p.hit && Math.abs(dx) < p.r * 0.8 && Math.abs(dy) < 26) {
        p.hit = true; R.rings++; S.stats.rings++;
        R.ringCombo = R.ringT > 0 ? R.ringCombo + 1 : 1; R.ringT = 3;
        const boost = Math.max(25, Math.abs(R.vy) * 0.1) * (1 + 0.15 * Math.min(R.ringCombo - 1, 4));
        R.vy += boost; sfx.ring(R.ringCombo);
        R.comfort = Math.min(1, R.comfort + 0.04); R.mood = 'joy'; R.moodT = 1;
        floater(p.x, p.py + 30, R.ringCombo > 1 ? `BOOST x${R.ringCombo}!` : 'BOOST!', '#4fd8ff', 20);
        sparks(p.x, p.py, 16, ['#4fd8ff', '#ffffff', '#bff8ff']);
      }
      if (p.hit) { p.fade = (p.fade || 0) + dt; if (p.fade > 0.5) p.dead = true; }
      continue;
    }
    if (dist < p.r + reach) {
      p.dead = true;
      if (p.type === 'coin') {
        const v = coinValue(R.alt);
        R.coins++; R.coinCash += v; S.stats.coins++;
        R.coinStreak = R.coinStreakT > 0 ? R.coinStreak + 1 : 0; R.coinStreakT = 0.6;
        sfx.coin(R.coinStreak);
        sparks(p.x, p.py, 5, ['#ffd93d', '#fff'], 120);
        if (v >= 8 || (v > 1 && R.coinStreak % 4 === 3)) floater(p.x, p.py + 16, '+' + fmtMoney(v * (v >= 8 ? 1 : 4)), '#ffd93d', 14);
      } else if (p.type === 'fuel') {
        const add = Math.min(st.fuelCap * 0.25, st.burn * 1.4 * st.canMul) * Math.pow(0.8, R.cans || 0);
        R.cans = (R.cans || 0) + 1;
        const wasEmpty = R.fuel <= 0 && R.dropFuel <= 0 && R.stage2Fuel <= 0;
        R.fuel = Math.min(R.stage === 2 ? Math.max(R.fuel + add, 0) : st.fuelCap, R.fuel + add);
        if (wasEmpty) { R.shownEngineOut = false; R.peakV = Math.max(R.vy, 1); floater(R.x, R.py + 70, 'RE-IGNITION!', '#ff9f43', 20); }
        sfx.fuel(); floater(p.x, p.py + 20, '+FUEL', '#ff9f43', 18);
      } else if (p.type === 'wrench') {
        R.hp = Math.min(st.hp, R.hp + 1); sfx.repair(); floater(p.x, p.py + 20, '+1 ♥', '#5fd068', 18);
      } else if (p.type === 'star') {
        const v = coinValue(R.alt) * 25; R.coins += 25; R.coinCash += v; R.starsGot++; sfx.bigcoin(); confetti(p.x, p.py, 24);
        floater(p.x, p.py + 20, `STAR! +${fmtMoney(v)}`, '#ffd93d', 22);
      }
    }
  }
  if (R.ringT > 0) R.ringT -= dt;
  if (R.coinStreakT > 0) R.coinStreakT -= dt;
  G.picks = G.picks.filter(p => !p.dead);
}

// ---------------------------------------------------------------- end of flight
function endFlight(crashed) {
  const R = G.R;
  if (R.ended) return;
  R.ended = true; R.endT = 0;
  if (R.wish && !crashed) updateWish(R, 0);
  G.mode = 'ending';
  AudioSys.setEngine(0, false);
  if (!crashed) { sfx.chute(); R.chute = true; }
  computeResult();
}
function updateEnding(dt) {
  const R = G.R;
  R.endT += dt;
  if (R.capsule) { const c = R.capsule; c.vy -= 300 * dt; if (c.vy < -60) { c.vy = -60; if (!c.chute) { c.chute = 0.01; sfx.chute(); } } if (c.chute) c.chute = Math.min(1, c.chute + dt * 3); c.x += c.vx * dt; c.py += c.vy * dt; c.vx *= 0.98; }
  else if (R.chute) { R.chuteY = Math.min(1, R.chuteY + dt * 2.5); R.py -= 40 * dt; R.tilt *= 0.95; R.x += Math.sin(G.t * 2) * 20 * dt; }
  G.cam.py += ((R.capsule ? R.capsule.py : R.py) - G.cam.py) * Math.min(1, dt * 3);
  G.cam.x += ((R.capsule ? R.capsule.x : R.x) - G.cam.x) * Math.min(1, dt * 2);
  updateObstacles(dt); updatePickups(dt);
  AudioSys.setWind(0);
  if (R.endT > (R.crashed ? 2.0 : 1.5) && !G.result.shown) { G.result.shown = true; UI.showResults(G.result); }
}
function computeResult() {
  const R = G.R, st = G.st;
  const alt = R.maxAlt;
  const r = R.route;
  const ctrlMul = 1 + 0.1 * st.control;
  const rows = [];
  const altPay = Math.round(altitudePay(alt) * (1 + 0.25 * st.cargo) * ctrlMul);
  rows.push(['Altitude ' + fmtAlt(alt), altPay]);
  const coinPay = Math.round(R.coinCash * ctrlMul);
  rows.push([`Coins ×${R.coins}`, coinPay]);
  const cnd = CONDS[R.cond] || CONDS.clear;
  if (cnd.coinMul) rows.push([`${cnd.name}: coins +${Math.round((cnd.coinMul - 1) * 100)}%`, Math.round(coinPay * (cnd.coinMul - 1))]);
  if (cnd.altMul) rows.push([`${cnd.name}: height +${Math.round((cnd.altMul - 1) * 100)}%`, Math.round(altPay * (cnd.altMul - 1))]);
  let fare = 0, reward = 0, firstTime = false, stars = 0;
  if (r && R.delivered) {
    const comfortMul = 0.5 + 0.5 * R.comfort;
    fare = Math.round(r.fare * R.pax * comfortMul * (1 + 0.4 * st.lounge) * ctrlMul);
    if (fare > 0) rows.push([`Fares: ${R.pax} passenger${R.pax > 1 ? 's' : ''}`, fare]);
    firstTime = !routeDone(r.id);
    if (firstTime) { reward = r.reward; rows.push(['First delivery bonus!', reward]); }
    stars = r.pax === 0 ? 3 : R.comfort >= 0.85 ? 3 : R.comfort >= 0.55 ? 2 : 1;
  }
  if (st.snack && R.pax > 0 && r) { const sn = Math.round(r.fare * R.pax * 0.04 * st.snack); if (sn > 0) rows.push(['Snack bar', sn]); }
  if (R.launchQ > 1.4) rows.push(['Perfect launch +10%', Math.round((altPay + coinPay) * 0.1)]);
  else if (R.launchQ > 1.2) rows.push(['Great launch +5%', Math.round((altPay + coinPay) * 0.05)]);
  const record = alt > S.bestAlt && S.flights > 0;
  if (record) rows.push(['New record bonus', Math.round(altPay * 0.25)]);
  if (st.gift) rows.push(['Gift shop sales', st.gift]);
  let dailyPaid = false;
  if (R.daily && R.dailyDone && S.daily && S.daily.day === R.daily.day && !S.daily.done) {
    const y = dayKey(new Date(Date.now() - 864e5));
    const streak = S.daily.last === y ? (S.daily.streak || 0) + 1 : 1;
    const pay = Math.round((150 + S.avg.total * 1.6) * (1 + 0.1 * Math.min(5, streak - 1)));
    rows.push([`Special delivery: ${R.daily.cargo}`, pay]);
    if (streak > 1) rows[rows.length - 1][0] += ` (${streak}-day streak!)`;
    S.daily.done = true; S.daily.streak = streak; S.daily.last = R.daily.day; S.stats.daily = (S.stats.daily || 0) + 1;
    dailyPaid = true;
  }
  const line = S.line || 1;
  if (line > 1) { const base = rows.reduce((a, x) => a + x[1], 0); rows.push([`Line #${line} bonus +${(line - 1) * 50}%`, Math.round(base * 0.5 * (line - 1))]); }
  const jobsPaid = settleJobs(R, rows);
  const total = rows.reduce((s, x) => s + x[1], 0);
  const core = rows.reduce((s, x) => s + (x[0].startsWith('Job:') || x[0] === 'First delivery bonus!' || x[0].startsWith('Special delivery') ? 0 : x[1]), 0);
  S.avg.total = S.avg.total * 0.65 + core * 0.35;
  const badges = [];
  if (R.delivered) badges.push('Delivered!');
  if (dailyPaid) badges.push('Special delivered!');
  if (record) badges.push('New record!');
  if (R.launchQ > 1.4) badges.push('Perfect launch');
  if (R.hits === 0 && R.time > 6) badges.push('No scratches');
  if (R.rings >= 3) badges.push(`${R.rings} boost rings`);
  if (R.smashed >= 3) badges.push(`${R.smashed} smashed`);
  if (R.wishOk) badges.push(R.wishOk > 1 ? `${R.wishOk} wishes granted` : 'Wish granted');
  if ((R.nearMiss || 0) >= 3) badges.push(`${R.nearMiss} close calls`);
  if (jobsPaid) badges.push(jobsPaid > 1 ? `${jobsPaid} jobs done` : 'Job done');
  if (R.crashed) badges.push('Kaboom');
  G.result = { faces: R.faces, rows, total, alt, crashed: R.crashed, delivered: R.delivered, route: r, firstTime, stars, record, badges, shown: false, zone: zoneAt(alt).name, time: R.time, daily: R.daily, dailyDone: R.dailyDone, dailyPaid };
  // ---- apply to save immediately (so closing the tab does not lose the flight)
  const prevFlights = S.flights;
  S.money += total; S.earned += total; S.flights++;
  saveGhost(R);
  S.stats.time += R.time; S.stats.pax += R.delivered ? R.pax : 0;
  if (R.delivered && R.faces) { S.met = S.met || {}; for (const f of R.faces) if (GUESTS[f]) S.met[f] = (S.met[f] || 0) + 1; }
  if (alt > S.bestAlt) S.bestAlt = alt;
  if (r && R.delivered) {
    const rec = S.routes[r.id] || { done: false, stars: 0, runs: 0 };
    rec.done = true; rec.stars = Math.max(rec.stars, stars); rec.runs++;
    S.routes[r.id] = rec;
    if (firstTime) {
      S.pendingStory = r.id;
      const nx = nextRoute(); if (nx) S.route = nx.id; else S.route = 'r7';
      if (r.id === 'r7') S.ended = true;
    }
  }
  if (R.cond === 'night') S.stats.nights++;
  S.cond = rollCond();
  fixDailyRoute();
  if (prevFlights === 0) S.pendingFirst = true;
  if (R.crashed && !S.seen.crash) S.pendingCrash = true;
  checkAchievements();
  saveGame();
}

function pickReview(res) {

function nice2(x) { x = Math.max(1, x); const m = Math.pow(10, Math.max(0, Math.floor(Math.log10(x)) - 1)); return Math.round(x / m) * m; }
const JB = s => `<b>${s}</b>`, JP = s => s;
const JOB_TYPES = {
  coins:   { w: 3, pay: 0.5,  txt: (j, b) => `Collect ${b(j.n)} coins`, prog: R => R.coins, make: () => nice2(Math.max(8, S.avg.coins * 1.2 + 4)) },
  rings:   { w: 2, pay: 0.55, txt: (j, b) => `Fly through ${b(j.n)} boost rings`, prog: R => R.rings, make: () => Math.max(2, Math.round(S.avg.rings * 1.3 + 1)) },
  close:   { w: 2, pay: 0.6,  txt: (j, b) => `Get ${b(j.n)} close calls`, prog: R => R.nearMiss || 0, make: () => Math.max(2, Math.round(S.avg.close * 1.3 + 1)) },
  clean:   { w: 2, pay: 0.6,  txt: (j, b) => `Reach ${b(fmtAlt(j.n))} without a scratch`, prog: R => R.hits === 0 ? R.maxAlt : (R.cleanAlt || 0), make: () => nice2(Math.max(400, S.avg.alt * 0.75)), alt: true },
  speed:   { w: 1, pay: 0.4,  txt: (j, b) => `Hit a top speed of ${b(fmtSpeed(j.n))}`, prog: R => R.topV || 0, make: () => nice2(S.avg.v * 1.08 + 10), spd: true },
  perfect: { w: 1, pay: 0.35, txt: (j, b) => `Nail a ${b('PERFECT')} launch`, prog: R => R.launchQ > 1.4 ? 1 : 0, make: () => 1, one: true },
  star:    { w: 1, pay: 0.6,  txt: (j, b) => `Catch a ${b('gold star')}`, prog: R => R.starsGot || 0, make: () => 1, one: true, tier: 2 },
  smash:   { w: 2, pay: 0.6,  txt: (j, b) => `Smash ${b(j.n)} things`, prog: R => R.smashed, make: () => Math.max(3, Math.round(S.avg.smash * 1.3 + 1)), need: () => lvl('ram') > 0 },
};
function jobsUnlocked() { return routeDone('r1'); }
function jobText(j, html) { return JOB_TYPES[j.t].txt(j, html ? JB : JP); }
function makeJob(exclude) {
  const tier = zoneIndex(S.bestAlt);
  const pool = [];
  for (const t in JOB_TYPES) { const d = JOB_TYPES[t]; if (exclude.includes(t) || (d.tier && tier < d.tier) || (d.need && !d.need())) continue; for (let i = 0; i < d.w; i++) pool.push(t); }
  const t = pool[Math.floor(Math.random() * pool.length)] || 'coins';
  const d = JOB_TYPES[t];
  return { t, n: d.make(), pay: nice2(Math.max(40, S.avg.total) * d.pay * 0.75 * rand(0.85, 1.15)), id: Math.random().toString(36).slice(2, 8) };
}
function fillJobs() {
  S.jobs = (S.jobs || []).filter(j => JOB_TYPES[j.t]);
  let added = 0;
  while (S.jobs.length < 3) { S.jobs.push(makeJob(S.jobs.map(j => j.t))); added++; }
  return added;
}
function checkJobs(R) {
  if (!R.jobs) return;
  for (const j of R.jobs) {
    if (j.done) continue;
    const p = JOB_TYPES[j.t].prog(R);
    j.p = p;
    if (p >= j.n) { j.done = true; R.jobsDone = (R.jobsDone || 0) + 1; banner('JOB DONE!', '#5fd068', 1.8, `${jobText(j, false)} · +${fmtMoney(j.pay)}`); sfx.ach(); confetti(R.x, R.py + 40, 30); }
  }
}
function settleJobs(R, rows) {

const BLOCK_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
window.addEventListener('keydown', e => {

  const inGame = G.mode === 'flight' || G.mode === 'launch';
  if (inGame && BLOCK_KEYS.has(e.code)) e.preventDefault();
  if (Dialog.active) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); Dialog.next(); } return; }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (inGame) setPaused(!G.paused); return; }
  if (G.paused) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (G.mode === 'launch') doLaunch();

    else if (G.mode === 'title' && e.code === 'Space') { e.preventDefault(); startGame(); }
  }
  if (e.code === 'Space' || e.code === 'Enter') {
    const vis = id => !$(id).classList.contains('hidden');
    if (vis('scr-results')) { e.preventDefault(); if (performance.now() - (G.resultAt || 0) > 900) $(e.code === 'Enter' ? 'res-hangar' : 'res-again').click(); return; }
    if (G.mode === 'hangar' && UI.current === 'hangar' && !vis('scr-map') && !vis('scr-settings') && !vis('scr-confirm') && !vis('scr-pause')) { e.preventDefault(); $('btn-launch').click(); return; }

// ================================================================ LOOP
function updateLaunch(dt) {
  const L = G.launch, R = G.R;
  L.t += dt;
  L.v += L.dir * dt * L.speed;
  if (L.v >= 1) { L.v = 1; L.dir = -1; }
  if (L.v <= 0) { L.v = 0; L.dir = 1; }
  G.cam.py += (R.py + 40 - G.cam.py) * Math.min(1, dt * 4);
  G.cam.x += (R.x - G.cam.x) * Math.min(1, dt * 4);
  G.cam.anchor += (0.6 - G.cam.anchor) * Math.min(1, dt * 3);
  if (chance(dt * 8)) G.parts.push({ k: 'smoke', x: rand(-40, 40), py: 4, vx: rand(-60, 60), vy: rand(10, 40), r: rand(6, 12), life: rand(0.8, 1.4), t: 0, col: '#ffffff' });
  AudioSys.setEngine(0.08, false);
}
function updateIdleCamera(dt) {
  const look = G.look || rocketLook();
  const py = padRestPy(look);
  const z = G.cam.z || worldZoom();
  let tx = 0, ty = py, ta = 0.64;
  if (G.mode === 'hangar') {
    if (H <= 520) { const panelW = Math.min(440, W * 0.54); const rsx = (W - panelW - 16) / 2; tx = -(rsx - W / 2) / z; ta = 0.78; }
    else if (W > 820) { const panelW = Math.min(580, W * 0.54); const rsx = (W - panelW - 32) / 2 + 10; tx = -(rsx - W / 2) / z; ta = 0.6; }
    else { ta = 0.24; ty = py * 0.95; }
  } else if (G.mode === 'title') { ta = 0.72; }
  G.cam.x += (tx - G.cam.x) * Math.min(1, dt * 4);
  G.cam.py += (ty - G.cam.py) * Math.min(1, dt * 4);
  G.cam.anchor += (ta - G.cam.anchor) * Math.min(1, dt * 4);
  if (chance(dt * 1.2)) G.parts.push({ k: 'smoke', x: rand(-30, 30), py: 6, vx: rand(-20, 20), vy: rand(10, 30), r: rand(4, 8), life: rand(1, 1.8), t: 0, col: '#ffffff' });
}
let lastT = performance.now() / 1000;
const DEBUG = { timeScale: 1, bot: false, frames: 0 };
function update(dt) {
  if (G.slowT > 0) { G.slowT -= dt; if (G.slowT <= 0) G.slow = 1; }
  const sdt = dt * G.slow;
  G.cam.shake = Math.max(0, G.cam.shake - dt * 40);
  G.cam.flash = Math.max(0, G.cam.flash - dt);
  G.hangarPop = Math.max(0, G.hangarPop - dt * 3);
  updatePokes(dt);
  if (DEBUG.bot && G.mode === 'flight') botSteer();
  if (G.mode === 'launch') updateLaunch(sdt);
  else if (G.mode === 'flight') updateFlight(sdt);
  else if (G.mode === 'ending') updateEnding(sdt);
  else updateIdleCamera(dt);
  updateParticles(sdt);
  // music by altitude
  if ((G.mode === 'flight' || G.mode === 'ending') && G.R) { // flight -> space -> deep as you climb (never back down), boss gallop during a fight
    const R = G.R; R.musTier = Math.max(R.musTier || 0, R.alt > 110000 ? 2 : R.alt > 12000 ? 1 : 0);
    const fight = R.boss && R.boss.id !== 'whale' && G.mode === 'flight' && !R.boss.paid;
    const want = fight ? 'boss' : ['flight', 'space', 'deep'][R.musTier];
    if (Music.current !== want && ['flight', 'space', 'deep', 'boss'].includes(Music.current)) Music.play(want);
  }
  saveTimer += dt;
}
function frame() {
  const now = performance.now() / 1000;
  let dt = Math.min(0.05, now - lastT); lastT = now;
  if (G.paused) dt = 0;
  const n = DEBUG.timeScale > 1 ? Math.round(DEBUG.timeScale) : 1;
  const t0 = performance.now();
  for (let i = 0; i < n; i++) { G.t += dt; update(dt); }
  render();
  DEBUG.frames++; DEBUG.ms = (DEBUG.ms || 0) * 0.95 + (performance.now() - t0) * 0.05; DEBUG.maxMs = Math.max(DEBUG.maxMs || 0, performance.now() - t0);
  requestAnimationFrame(frame);
}

// a simple autopilot used for automated play-testing (window.__skyhop.bot = true)
function botSteer() {
  const R = G.R; let push = 0;
  const bs = R.boss;
  if (bs) {
    const rx = w2s(R.x, R.py)[0], u = G.cam.z;
    if (bs.id === 'storm') for (const k of bs.strikes) if (k.st === 'warn' && Math.abs(rx - k.x) < 100 * u) push += (rx >= k.x ? 1 : -1) * 4;
    if (bs.id === 'whale' && !bs.boosted && bs.hole) push += clamp((bs.hole[0] - rx) / (40 * u), -1.5, 1.5);
    if (bs.id === 'kraken') { const k = bs.strikes.find(q => q.st === 'come' && q.y < w2s(R.x, R.py)[1] + 10); if (k) push += clamp((k.gx - rx) / (25 * u), -4, 4); }
  }
  for (const o of G.obs) {
    if (o.harmless || o.dead) continue;
    const dy = o.py - R.py; if (dy < -20 || dy > 420) continue;
    const dx = o.x - R.x; const rad = (o.w ? o.w * 0.5 : o.r) + 50;
    if (Math.abs(dx) < rad) push += (dx > 0 ? -1 : 1) * (1 - dy / 420) * 3;
  }
  if (Math.abs(push) < 0.3) { // drift toward coins/rings
    let best = null, bd = 1e9;
    for (const p of G.picks) { const dy = p.py - R.py; if (dy < 0 || dy > 500) continue; const d = Math.abs(p.x - R.x) + dy * 0.5; if (d < bd) { bd = d; best = p; } }
    if (best) push = clamp((best.x - R.x) / 80, -1, 1);
  }
  G.input.keys.ArrowLeft = push < -0.25; G.input.keys.ArrowRight = push > 0.25;
  if (G.st.ab && R.abCd <= 0 && R.fuel > 0) tryAfterburner();
}

// ================================================================ BOOT
loadSave();
if (!S.met) { S.met = {}; for (const r of ROUTES) if (routeDone(r.id)) for (const f of (r.pax ? r.who.slice(0, r.pax) : ['buckley'])) S.met[f] = 1; }
resize();
G.st = computeStats(); G.look = rocketLook();
G.cam.py = padRestPy(G.look); G.cam.anchor = 0.72; G.cam.z = worldZoom();
UI.showScreen('title');
if (S.seen.intro) {
  $('btn-start').textContent = 'Continue';
  const nr = nextRoute(), nDone = ROUTES.filter(r => routeDone(r.id)).length;
  $('title-foot').innerHTML = `Welcome back! ${S.flights} flights · best <b>${fmtAlt(S.bestAlt)}</b> · ${nDone}/${ROUTES.length} routes${nr ? ` · next: <b>${nr.to}</b>` : ' · Endless mode'}`;
  if (dailyUnlocked()) { const d = todaysDaily(); const pill = document.createElement('div'); pill.className = 'title-daily'; pill.innerHTML = d.done ? `Today's special delivered! Come back tomorrow.` : `Today's special: <b>${d.cargo}</b> for ${d.to} · ${fmtAlt(d.target)}${dailyStreakAlive() ? ` · ${dailyStreakAlive()}-day streak` : ''}`; document.querySelector('#scr-title .tagline').after(pill); }
}
Music.play('title');
requestAnimationFrame(frame);

// debug / test hooks
window.__skyhop = {
  G, DEBUG, get S() { return S; }, computeStats, simulateFlight, UPGRADES, ROUTES, UP, art: { drawStation, routeIconCanvas, drawFace, makePostcard, guideIcon, GUIDE },
  set bot(v) { DEBUG.bot = v; }, set timeScale(v) { DEBUG.timeScale = v; },
  setMoney(v) { S.money = v; if (UI.current === 'hangar') UI.refresh(); },
  setLevel(id, l) { S.up[id] = l; G.look = rocketLook(); G.st = computeStats(); if (UI.current === 'hangar') UI.refresh(); },
  done(id) { S.routes[id] = { done: true, stars: 3, runs: 1 }; const nx = nextRoute(); S.route = nx ? nx.id : 'free'; },
  start: startGame, launch(v = 0.8) { $('scr-results').classList.add('hidden'); if (G.mode !== 'launch') enterLaunch(); G.launch.v = v; doLaunch(); },
  hangar: () => goHangar(true), reset() { resetSave(); },
  daily() { return todaysDaily(); },
  teleport(alt) { const R = G.R; if (!R) return; R.alt = alt; R.maxAlt = Math.max(R.maxAlt, alt); },
  save: saveGame, music: Music, audio: AudioSys, sfxTest() { const errs = []; for (const k in AudioSys.sfx) { try { AudioSys.sfx[k](); } catch (e) { errs.push(k + ':' + e.message); } } return errs; },
  candidates() { return UPGRADES.filter(u => upState(u) === 'open').map(u => ({ id: u.id, cost: upCost(u) })); },
  buy(id) { const u = UP[id]; const c = upCost(u); if (upState(u) !== 'open' || c > S.money) return false; S.money -= c; S.up[id] = lvl(id) + 1; G.look = rocketLook(); G.st = computeStats(); saveGame(); return true; },
};
})();
</script>
